<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5a42">
<meta name="description" content="Curso de cozinha passo a passo, com receitas e um ajudante que funciona sem internet.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
@font-face{font-family:"Figtree";font-style:normal;font-weight:400 800;font-display:swap;src:url(fontes/figtree.woff2) format("woff2")}
@font-face{font-family:"Young Serif";font-style:normal;font-weight:400;font-display:swap;src:url(fontes/young-serif.woff2) format("woff2")}
</style>
</head>
<body>
<title>Cozinha do Flavio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mundo: louça de ágata. Esmalte claro salpicado, filete duplo verde-garrafa, vermelho-tomate para agir.
   Layout: uma coluna de leitura (860px) sob uma barra fina; no celular a navegação desce para o rodapé. */
:root{
  --bg:#eef2ec; --surface:#fbfdf9; --chip:#dfe7de; --line:#c3cfc4;
  --ink:#14241c; --muted:#4c5f54;
  --verde:#1d5a42; --verde-ink:#f4f8f2;
  --tomate:#c2321f; --tomate-ink:#ffffff; --tomate-t:#a82816;
  --good:#1d5a42; --bad:#a82816; --warn:#7a5200;
  --fogo-on:#d4501c; --fogo-off:#6f8677; --traco:#6f8677; --salpico:rgba(20,36,28,.09);
  --f-disp:"Young Serif",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1f19; --surface:#172b23; --chip:#213a30; --line:#35513f;
  --ink:#edf2ea; --muted:#a6b8ab;
  --verde:#86cfa9; --verde-ink:#0f1f19;
  --tomate:#ff7d66; --tomate-ink:#2b0903; --tomate-t:#ff8f7b;
  --good:#86cfa9; --bad:#ff8f7b; --warn:#f0c060;
  --fogo-on:#ff9a4d; --fogo-off:#6a8574; --traco:#6a8574; --salpico:rgba(237,242,234,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1f19; --surface:#172b23; --chip:#213a30; --line:#35513f;
  --ink:#edf2ea; --muted:#a6b8ab;
  --verde:#86cfa9; --verde-ink:#0f1f19;
  --tomate:#ff7d66; --tomate-ink:#2b0903; --tomate-t:#ff8f7b;
  --good:#86cfa9; --bad:#ff8f7b; --warn:#f0c060;
  --fogo-on:#ff9a4d; --fogo-off:#6a8574; --traco:#6a8574; --salpico:rgba(237,242,234,.06); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  background-image:radial-gradient(var(--salpico) 1px,transparent 1.5px),radial-gradient(var(--salpico) 1px,transparent 1.7px);
  background-size:37px 41px,53px 47px;background-position:0 0,19px 23px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2,h3{text-wrap:balance}
p,li{text-wrap:pretty}
/* O atributo hidden sempre vence: botões e rodapés têm display próprio, que apagaria a regra do navegador. */
[hidden]{display:none!important}
ul,ol{padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--tomate);outline-offset:2px;border-radius:6px}

/* barra do topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--verde);box-shadow:0 5px 0 -3px var(--surface),0 6px 0 -3px var(--verde)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topo-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{font-family:var(--f-disp);font-size:21px;line-height:1.1;color:var(--verde);margin-right:auto;white-space:nowrap}
.marca b{font-weight:400;color:var(--tomate-t)}
.nav{display:flex;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;font-weight:600;font-size:15px;min-height:28px}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--chip)}
.nav button[aria-current="page"]{background:var(--verde);color:var(--verde-ink)}
.nav button:focus-visible{outline:3px solid var(--tomate);outline-offset:2px}
.iconbtn{border:0;cursor:pointer;width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--ink);display:inline-grid;place-items:center;font-size:18px;flex:none}
.iconbtn svg{width:20px;height:20px}

.pagina{max-width:892px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aviso{background:var(--chip);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--muted);margin-bottom:16px}
.view{display:flex;flex-direction:column;gap:24px;min-width:0}

@media (max-width:760px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--verde);justify-content:space-around;gap:0;
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;font-size:12px;padding:6px 2px;min-height:48px;justify-content:center;border-radius:12px}
  .nav button svg{width:22px;height:22px}
  .pagina{padding-bottom:104px}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
}

/* tipografia */
.h-pag{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,5vw,38px);line-height:1.1}
.h-sec{font-family:var(--f-disp);font-weight:400;font-size:21px;line-height:1.2;color:var(--verde)}
.sobre{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted,.nota{color:var(--muted)}
.nota{font-size:14px}
.prosa{max-width:62ch}
.prosa p+p{margin-top:8px}

/* botões */
.btn{border:0;cursor:pointer;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.acao{background:var(--tomate);color:var(--tomate-ink)}
.btn.soft{background:var(--chip);color:var(--ink)}
.btn.contorno{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--traco)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.grande{min-height:60px;font-size:18px;flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled),.iconbtn:active{transform:scale(.97)}
.linkbtn{all:unset;cursor:pointer;padding-block:12px;text-decoration:underline;text-underline-offset:3px;font-weight:600;color:var(--verde)}
.linkbtn:focus-visible{outline:3px solid var(--tomate);outline-offset:2px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* superfícies */
.aro{background:var(--surface);border:2px solid var(--verde);border-radius:22px;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4.5px var(--verde);padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.aro .h-pag{font-size:clamp(26px,4.6vw,34px)}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-topo{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.numeros{display:flex;flex-wrap:wrap;gap:8px 28px}
.numeros div{display:flex;flex-direction:column}
.numeros b{font-variant-numeric:lining-nums tabular-nums;font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.numeros span{font-size:14px;color:var(--muted)}

/* linhas de lista */
.lista{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.linha{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;border-bottom:1px solid var(--line);width:100%}
.linha:last-child{border-bottom:0}
.linha:hover{background:var(--chip)}
.linha:focus-visible{outline:3px solid var(--tomate);outline-offset:-3px}
.linha .cresce{flex:1;min-width:0}
.linha .t{font-weight:600;overflow-wrap:anywhere}
.linha .m{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
div.linha{cursor:default}
div.linha:hover{background:transparent}
.marca-est{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:800;border:2px solid var(--traco);color:transparent}
.marca-est.feita{background:var(--verde);border-color:var(--verde);color:var(--verde-ink)}
.marca-est.pulada{border-color:var(--verde);color:var(--verde)}
.marca-est.repetir{border-color:var(--warn);color:var(--warn)}
.marca-est.prox{border-color:var(--tomate);box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 20px var(--tomate)}
.tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);white-space:nowrap}
.tag.good{color:var(--good)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.vazio{color:var(--muted);padding:16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.barra{height:12px;background:var(--chip);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px}

/* fogo */
.fogo{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;white-space:nowrap}
.fogo i{display:block;width:14px;height:18px}
.fogo svg{width:100%;height:100%;fill:var(--fogo-off)}
.fogo i.on svg{fill:var(--fogo-on)}
.fogo b{font-size:13px;font-weight:700;margin-left:4px;letter-spacing:.02em}
.fogo.g i{width:24px;height:30px}
.fogo.g b{font-size:18px;margin-left:8px}

/* aula e receita */
.cab{display:flex;flex-direction:column;gap:8px}
.voltar{align-self:flex-start;margin-top:-12px}
.meta{color:var(--muted);font-size:15px}
.nota.erro{color:var(--bad);font-weight:700}
#dlg-tit:focus{outline:none}
.observar li,.erros li,.ing li,.uts li{padding:8px 0;border-bottom:1px solid var(--line)}
.observar li:last-child,.erros li:last-child,.ing li:last-child,.uts li:last-child{border-bottom:0}
.observar li{padding-left:28px;position:relative}
.observar li::before{content:"";position:absolute;left:4px;top:15px;width:10px;height:10px;border-radius:50%;border:2px solid var(--verde)}
.erros b{display:block}
.rec-meta{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.porc{display:inline-flex;align-items:center;gap:8px}
.porc b{min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
.duas{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
@media (max-width:640px){.duas{grid-template-columns:minmax(0,1fr)}}
.ing .obs{color:var(--muted);font-size:14px}
.passos{counter-reset:p;display:flex;flex-direction:column}
.passos li{counter-increment:p;display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 8px;padding:12px 0;border-bottom:1px solid var(--line)}
.passos li:last-child{border-bottom:0}
.passos li::before{content:counter(p);font-family:var(--f-disp);font-size:21px;line-height:1.2;color:var(--verde)}
.passos .extra{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px;color:var(--muted)}
.passos .extra .sinal{flex-basis:100%;color:var(--ink);font-size:16px}
.passos .extra .sinal b{color:var(--verde)}
.hist{border-left:4px solid var(--verde);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.hist.repetir{border-color:var(--warn)}
.diag{white-space:pre-wrap;background:var(--chip);border-radius:12px;padding:12px 14px;overflow-wrap:anywhere}

/* abas */
.abas{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:4px;max-width:100%;overflow-x:auto;align-self:flex-start}
.abas button{border:0;background:transparent;border-radius:999px;padding:8px 14px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.abas button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14),inset 0 0 0 1.5px var(--traco)}
.abas .n{margin-left:6px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
/* No celular as quatro abas dividem a largura e o número desce para baixo do nome. */
@media (max-width:520px){
  .abas{align-self:stretch;overflow:visible;border-radius:22px}
  .abas button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;min-height:52px;border-radius:18px;line-height:1.15;font-size:14px}
  .abas .n{margin:0;font-size:12px}
}

/* formulários */
.inp{border:1.5px solid var(--traco);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px;width:100%;color:var(--ink)}
textarea.inp{min-height:88px;resize:vertical}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.frow>.inp{flex:1 1 180px;min-width:0}
.campo{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.notas{display:flex;flex-direction:column;gap:8px}
.notas label{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;border:2px solid var(--traco);border-radius:14px;cursor:pointer;font-weight:700}
.notas label:has(input:checked){border-color:var(--verde);background:var(--chip)}
.notas input{width:20px;height:20px;accent-color:var(--verde);flex:none}
.notas small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.compra{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 16px;min-height:52px;border-bottom:1px solid var(--line)}
.compra:last-child{border-bottom:0}
.compra label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px;overflow-wrap:anywhere}
.compra input{width:22px;height:22px;accent-color:var(--verde);flex:none}
.compra.feito label span{text-decoration:line-through;color:var(--muted)}
.xbtn{border:0;background:transparent;cursor:pointer;width:44px;height:44px;border-radius:50%;color:var(--muted);font-size:20px;flex:none}
.xbtn:hover{background:var(--chip)}
table.med{border-collapse:collapse;width:100%}
table.med td,table.med th{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.med th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rolagem{overflow-x:auto}

/* diálogo */
dialog{border:2px solid var(--verde);border-radius:20px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:hidden}
dialog::backdrop{background:rgba(8,16,12,.55)}
/* Cabeçalho e rodapé ficam parados; só o meio rola, então fechar está sempre à mão. */
.dlg{display:flex;flex-direction:column;gap:16px;padding:16px 20px 20px;max-height:calc(100dvh - 36px)}
.dlg-cab{display:flex;align-items:flex-start;gap:12px;flex:none}
.dlg h2{font-family:var(--f-disp);font-weight:400;font-size:22px;line-height:1.2;flex:1;padding-top:9px}
.dlg-corpo{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;overflow-y:auto;flex:0 1 auto;overscroll-behavior:contain}
.dlg-pe{flex:none}
.iconbtn:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
.sintomas details{border-bottom:1px solid var(--line)}
.sintomas details:last-child{border-bottom:0}
.sintomas summary{min-height:48px;display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:700;cursor:pointer;list-style:none}
.sintomas summary::-webkit-details-marker{display:none}
.sintomas summary::after{content:"+";margin-left:auto;font-size:24px;line-height:1;font-weight:400;color:var(--verde);flex:none}
.sintomas details[open] summary::after{content:"−"}
.sintomas summary:focus-visible{outline:3px solid var(--verde);outline-offset:2px;border-radius:8px}
.sintomas p{padding:0 0 14px}
.dlg-pe{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto}
.bolha{padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%}
.bolha.u{align-self:flex-end;background:var(--verde);color:var(--verde-ink)}
.bolha.c{align-self:flex-start;background:var(--chip)}
.bolha .fonte{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.bolha .linkbtn.fonte{color:var(--verde);padding-block:6px}
.bolha .tambem{margin-top:8px;white-space:normal}
.bolha .tambem summary{min-height:44px;font-weight:600}
.bolha .tambem .so{padding:10px 0;border-bottom:1px solid var(--line)}
.escolhas{display:flex;flex-wrap:wrap;gap:8px}
.escolha{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;padding:8px 16px;border-radius:999px;background:var(--chip);color:var(--ink);font-weight:600;font-size:15px;border:1px solid var(--line)}
.escolha[aria-pressed="true"]{background:var(--verde);color:var(--verde-ink);border-color:var(--verde)}
.escolha:focus-visible{outline:3px solid var(--tomate);outline-offset:2px}

/* avisos rápidos */
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:12px;max-width:520px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{all:unset;cursor:pointer;text-decoration:underline;font-weight:800;white-space:nowrap;min-height:44px;padding:0 4px;display:inline-flex;align-items:center}
.toast button:focus-visible{outline:3px solid var(--bg);outline-offset:2px;border-radius:6px}

/* modo cozinhar */
body.cozinhando .topo,body.cozinhando .aviso{display:none}
body.cozinhando .pagina{max-width:760px;padding-block:0;min-height:100%;display:flex;flex-direction:column}
body.cozinhando .view{flex:1;gap:0}
.cz-topo{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--verde)}
.cz-tit{flex:1;min-width:0;display:flex;flex-direction:column}
.cz-tit b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cz-tit span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.cz-timers{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.cz-timers:empty{display:none}
.relogio{border:2px solid var(--verde);background:var(--surface);border-radius:999px;padding:2px 2px 2px 18px;min-height:52px;display:flex;align-items:center;gap:10px;min-width:0}
.relogio .nome{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.relogio .nome b{font-weight:700}
.relogio .nome span{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relogio .tempo{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.relogio-x{border:0;background:transparent;color:inherit;cursor:pointer;width:46px;height:46px;border-radius:50%;font-size:22px;flex:none}
.relogio-x:hover{background:var(--chip)}
.relogio-ir{border:0;background:var(--tomate-ink);color:var(--tomate);font-weight:700;font-size:14px;border-radius:999px;padding:0 14px;min-height:44px;cursor:pointer;flex:none}

<script>
(function(){
"use strict";

/*CONTEUDO-INI*/
// Conteúdo do curso. Tudo aqui é fixo; o progresso do Flavio fica na conta dele.
// I(quantidade para 3 pessoas | null, unidade, item, observação)   P(texto, fogo 1-3 | null, timer em segundos | null, sinal de pronto)
const I=(q,u,item,obs)=>obs?{q,u,item,obs}:{q,u,item};
const P=(txt,fogo=null,timer=null,pronto)=>pronto?{txt,fogo,timer,pronto}:{txt,fogo,timer};
// Quantidade escalada, em frações de cozinha: escalar(1,1,3) = "⅓".
function escalar(q,porcoes,base){
  if(q==null)return"";
  const v=q*porcoes/base;let n=Math.floor(v+1e-9);const f=v-n;
  const F=[[0,""],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"],[1,""]];
  let m=F[0];for(const x of F)if(Math.abs(x[0]-f)<Math.abs(m[0]-f))m=x;
  if(m[0]===1)n++;
  if(!n&&!m[1])return"¼";
  return(n||"")+m[1];
}

// ===== Módulo 0: antes de acender o fogo =====
A("m0","pao-na-chapa","Ler, separar e só depois acender",{prato:"Pão na chapa",min:10,ensina:["organizar"],
  ideia:"Quem cozinha bem não corre: lê a receita inteira antes, separa tudo o que vai usar e só então acende o fogo. Com a bancada pronta, você olha para a panela em vez de procurar a espátula. O pão na chapa é rápido o bastante para mostrar isso: se a manteiga não estiver passada quando a frigideira esquentar, ele queima.",
  observar:["A frigideira está quente quando uma gota d'água chia e some em dois segundos.","O pão dourado tem cor de caramelo claro e cheiro de manteiga tostada.","Cheiro de queimado aparece antes da cor: confie no nariz.","Cabo da frigideira sempre virado para dentro do fogão, nunca para fora."],

    ["Ficou pálido e mole.","A frigideira estava fria. Espere o teste da gota d'água antes de pôr o pão."],

  ideia:"O botão do fogão tem três posições que importam: baixo, médio e alto. O fogo certo não se descobre pelo relógio, e sim pelo som e pelo cheiro. A pipoca ensina isso melhor que qualquer prato, porque ela avisa: você ouve quando começa, quando acelera e quando é hora de desligar.",
  observar:["Fogo alto: a chama aparece, mas não passa da borda da panela.","Os três grãos de teste estouram quando o óleo chegou na temperatura.","Estouros rápidos e seguidos: está no auge. Continue sacudindo.","Dois a três segundos entre um estouro e outro: desligue na hora."],

  ing:[I(6,"","ovos"),I(1,"c. sopa","manteiga"),I(.5,"c. chá","sal")],
  ut:["Frigideira antiaderente","Espátula de silicone","Tigela","Garfo"],

    P("Derreta a manteiga na frigideira.",1,null,"a manteiga derreteu sem chiar e sem mudar de cor"),

    P("Desligue o fogo e passe para o prato na hora.")],

    ["Soltou água no prato.","O ovo passou do ponto e a proteína espremeu a água. Menos tempo no fogo."],

A("m1","ovo-frito","Ovo frito de gema mole",{min:10,ensina:["fritar"],
  ideia:"Fritar em pouca gordura pede fogo médio e óleo quente antes de a comida entrar: é o chiado na entrada que impede de grudar. No ovo frito o desafio é cozinhar a clara inteira sem endurecer a gema, e a tampa resolve isso: o vapor preso cozinha a parte de cima.",
  observar:["O óleo está pronto quando corre solto pela frigideira, como água.","O ovo deve chiar baixo ao entrar. Se estalar e espirrar, o fogo está alto.","Clara toda branca e firme, sem parte transparente perto da gema.","A gema treme quando você balança a frigideira: está mole."],
  ing:[I(3,"","ovos"),I(1,"c. sopa","óleo"),I(null,"","sal")],
  ut:["Frigideira antiaderente com tampa","Espátula","Xícara"],
  passos:[P("Quebre um ovo na xícara. Assim você tira qualquer casca e não fura a gema na frigideira."),
    P("Aqueça o óleo na frigideira.",2,60,"o óleo corre solto quando você inclina a frigideira"),
    P("Deslize o ovo da xícara para a frigideira, bem de perto. Repita com os outros, deixando espaço entre eles.",2),
    P("Baixe o fogo, salgue e tampe.",1,120,"a clara está toda branca e a gema ainda treme"),
    P("Solte as bordas com a espátula e sirva.")],
  erros:[["A borda queimou e a clara de cima ficou crua.","Fogo alto e frigideira sem tampa. Fogo baixo depois que o ovo entra, e tampe."],
    ["A gema estourou.","Quebre o ovo na xícara antes e deslize de perto, sem jogar de cima."],
    ["O óleo espirrou.","A frigideira estava molhada ou o fogo alto. Seque bem a frigideira antes e use fogo médio."]]});
A("m1","omelete","Omelete de queijo",{min:15,ensina:["virar"],
  ideia:"A omelete junta o que você já sabe sobre ovo e acrescenta um gesto: soltar as bordas e dobrar de uma vez. Quem hesita no meio do movimento rasga a omelete. O segredo está antes: uma camada firme embaixo, ainda úmida em cima, e a espátula passando por baixo inteira.",
  observar:["A borda da omelete fica opaca e solta da frigideira quando está firme.","O centro ainda brilha e treme um pouco na hora de dobrar: é o certo.","A omelete desliza inteira quando você balança a frigideira. Se não desliza, ainda está grudada.","O queijo derrete com o calor de dentro depois da dobra."],
  ing:[I(6,"","ovos"),I(100,"g","queijo muçarela ralado"),I(1,"c. sopa","manteiga"),I(.5,"c. chá","sal"),I(2,"c. sopa","cebolinha picada","opcional")],
  ut:["Frigideira antiaderente grande","Espátula larga","Tigela","Garfo"],
  passos:[P("Bata os ovos com o sal na tigela, só até misturar."),
    P("Derreta a manteiga e espalhe pela frigideira toda.",2,null,"a manteiga espuma de leve"),
    P("Despeje os ovos. Nos primeiros trinta segundos, puxe as bordas para o centro e incline a frigideira para o ovo cru escorrer para o lugar vazio.",2,30),
    P("Baixe o fogo e pare de mexer. Espalhe o queijo e a cebolinha em uma metade.",1,90,"a borda está opaca e o centro ainda brilha"),
    P("Passe a espátula por baixo da metade sem queijo e dobre de uma vez sobre a outra."),
    P("Espere o queijo derreter e deslize a omelete para o prato.",1,30)],
  erros:[["Rasgou na hora de dobrar.","Estava grudada ou crua demais embaixo. Espere a borda soltar e passe a espátula por baixo inteira antes de dobrar."],
    ["Ficou marrom e seca por fora.","Fogo alto. Depois de despejar os ovos, fogo baixo."],
    ["O recheio vazou.","Recheio demais ou espalhado até a borda. Deixe um dedo livre em volta."]]});

A("m2","vinagrete","A faca e a mão em garra",{prato:"Vinagrete",min:20,ensina:["faca","picar"],
  ideia:"Cortar com segurança depende de três coisas: tábua que não escorrega, faca segura perto da lâmina e a outra mão em garra, com as pontas dos dedos dobradas para dentro e os nós dos dedos guiando a faca. Faca afiada é mais segura que faca cega, porque não exige força. O vinagrete treina tudo isso: cebola, tomate e pimentão em cubos do mesmo tamanho.",
  observar:["Um pano úmido debaixo da tábua: ela não pode andar.","Os nós dos dedos encostam na lateral da lâmina; as pontas ficam escondidas atrás.","A ponta da faca fica na tábua e o cabo sobe e desce, como uma gangorra.","Deixe a raiz da cebola inteira: ela segura as camadas enquanto você corta."],
  ing:[I(3,"","tomates maduros e firmes"),I(1,"","cebola"),I(.5,"","pimentão verde"),I(3,"c. sopa","vinagre"),I(3,"c. sopa","azeite"),I(.5,"c. chá","sal"),I(2,"c. sopa","cheiro-verde picado")],
  ut:["Faca de cozinha afiada","Tábua","Pano úmido","Tigela"],
  passos:[P("Estenda o pano úmido na bancada e ponha a tábua em cima. Empurre: ela não deve se mexer."),
    P("Corte a cebola ao meio passando pela raiz e descasque. Com a metade deitada, faça cortes paralelos em direção à raiz, sem chegar nela. Depois corte atravessado: saem cubos."),
    P("Corte o tomate ao meio, tire as sementes com uma colher, corte em tiras e as tiras em cubos."),
    P("Tire as sementes e a parte branca do pimentão e corte do mesmo tamanho."),
    P("Misture tudo na tigela com o vinagre, o azeite, o sal e o cheiro-verde."),
    P("Deixe descansar para os sabores se juntarem. Prove e ajuste o sal.",null,600,"o caldo no fundo está saboroso, nem ácido demais nem sem graça")],
  erros:[["Os pedaços saíram de tamanhos muito diferentes.","Normal no começo. Vá devagar: velocidade vem depois de igualdade."],
    ["A cebola desmontou.","Você cortou a raiz. Mantenha a raiz inteira até o último corte."],
    ["Ficou ácido demais.","Junte mais um fio de azeite e uma pitada de sal. O azeite arredonda o vinagre."]]});
A("m2","salada","Salada temperada na hora",{min:15,ensina:["temperar-cru"],
  ideia:"Tempero de salada tem uma proporção que serve para sempre: uma parte de ácido, três de azeite e sal. O ácido pode ser limão ou vinagre. Duas regras fazem a diferença: folha seca, porque o molho escorrega em folha molhada, e temperar só na hora de servir, porque o sal murcha a folha em minutos.",
  observar:["Folha bem seca: sacuda e enxugue com pano limpo ou papel.","O molho batido com garfo fica turvo e levemente grosso.","Prove o molho numa folha, não na colher.","Cada folha brilha, mas não sobra poça no fundo da tigela."],
  ing:[I(1,"","pé de alface"),I(2,"","tomates"),I(1,"","pepino"),I(1,"","cenoura"),I(1,"c. sopa","suco de limão"),I(3,"c. sopa","azeite"),I(.5,"c. chá","sal")],
  ut:["Tigela grande","Faca e tábua","Ralador","Pote pequeno ou xícara","Garfo"],
  passos:[P("Solte as folhas de alface, lave uma a uma em água corrente e seque muito bem."),
    P("Rasgue as folhas com as mãos em pedaços de uma garfada."),
    P("Corte os tomates em gomos e o pepino em rodelas finas. Rale a cenoura."),
    P("No pote, misture o limão e o sal até dissolver. Junte o azeite e bata com o garfo.",null,null,"o molho ficou turvo e um pouco grosso"),
    P("Só na hora de servir, despeje o molho na tigela e misture com as mãos ou dois garfos, de baixo para cima."),
    P("Prove uma folha e ajuste: falta vida, mais limão; está ácido, mais azeite.")],
  erros:[["A salada murchou.","Foi temperada cedo demais. Deixe o molho separado até a hora de comer."],
    ["O molho ficou no fundo e a folha sem gosto.","As folhas estavam molhadas. Seque melhor."],
    ["Ficou salgada.","Junte mais folhas e um fio de azeite. Da próxima, dissolva o sal no limão antes, para medir melhor."]]});
A("m2","guacamole","Picar miúdo e ajustar",{prato:"Guacamole",min:15,ensina:["picar","provar"],
  ideia:"Picar miúdo é repetir o corte em cubos com passadas mais estreitas. Quanto menor o pedaço, mais ele se espalha pelo prato, e é por isso que a cebola do guacamole precisa ser bem pequena. Aqui você também treina o ajuste final: abacate pede sal e limão, e só provando você sabe quanto.",
  observar:["Abacate maduro cede quando você aperta de leve perto do cabo.","Cebola picada miúda: pedaços menores que um grão de feijão.","Amasse com garfo deixando alguns pedaços: não é para virar creme.","Sem graça é falta de sal. Pesado e enjoativo é falta de limão."],
  ing:[I(2,"","abacates avocado maduros","ou meio abacate grande"),I(1,"","tomate"),I(.5,"","cebola pequena"),I(1,"","limão"),I(2,"c. sopa","coentro picado","ou cheiro-verde"),I(.5,"c. chá","sal")],
  ut:["Faca e tábua","Tigela","Garfo","Colher"],
  passos:[P("Pique a cebola bem miúda, usando os cortes da aula do vinagrete com passadas mais estreitas."),
    P("Tire as sementes do tomate e pique em cubos pequenos. Pique o coentro."),
    P("Corte o abacate ao meio em volta do caroço, gire as metades para abrir e tire a polpa com a colher."),
    P("Amasse o abacate na tigela com o garfo, com o suco de meio limão e o sal."),
    P("Misture a cebola, o tomate e o coentro."),
    P("Prove com uma colher e ajuste o sal e o limão, um de cada vez.",null,null,"o sabor está vivo, sem ficar azedo")],
  erros:[["Escureceu rápido.","Abacate escurece no ar. O limão atrasa; sirva logo ou cubra com filme encostado na superfície."],
    ["Ficou com gosto forte de cebola crua.","Pedaços grandes ou cebola demais. Pique menor, ou lave a cebola picada em água fria e escorra."],
    ["O abacate estava duro.","Não estava maduro. Deixe dois ou três dias fora da geladeira, embrulhado em jornal."]]});

A("m3","arroz-branco","Refogar e o arroz soltinho",{prato:"Arroz branco",min:30,ensina:["refogar","absorcao"],
  ideia:"Refogar é cozinhar cebola e alho na gordura até ficarem macios e perfumados: é o primeiro passo de quase todo prato salgado brasileiro. A cebola entra antes porque demora mais; o alho entra por último porque queima em segundos e amarga. Depois, o arroz cozinha por absorção: duas medidas de água para uma de arroz, tampa e nada de mexer.",
  observar:["Cebola pronta: transparente e macia, sem dourar.","Alho pronto: cheiro doce e forte, ainda claro. Dourou, está no limite.","Prove a água antes de tampar: deve estar levemente salgada, como um caldo fraco.","Arroz pronto: furinhos na superfície e nenhum barulho de água fervendo no fundo."],
  ing:[I(1.5,"xíc","arroz branco"),I(3,"xíc","água quente"),I(.5,"","cebola picada"),I(2,"dente","alho picado"),I(1,"c. sopa","óleo"),I(1,"c. chá","sal")],
  ut:["Panela média com tampa","Colher de pau","Chaleira ou outra panela para a água","Garfo"],
  passos:[P("Ponha a água para esquentar na chaleira. Pique a cebola e o alho antes de acender a panela."),
    P("Aqueça o óleo na panela e refogue a cebola, mexendo.",2,120,"a cebola ficou transparente e macia"),
    P("Junte o alho e mexa sem parar.",2,30,"subiu o cheiro do alho e ele ainda está claro"),
    P("Junte o arroz e mexa até os grãos ficarem brilhantes.",2,60),
    P("Despeje a água quente, junte o sal, mexa uma vez e prove a água.",3,null,"a água ferveu e está levemente salgada"),
    P("Baixe o fogo, tampe deixando uma frestinha e não mexa mais.",1,900,"furinhos na superfície e nenhum som de água no fundo"),
    P("Desligue, tampe por completo e deixe descansar. Depois solte com o garfo.",null,300)],
  erros:[["Ficou empapado.","Água demais ou você mexeu durante o cozimento. Meça com a mesma xícara e não mexa depois de tampar."],
    ["Queimou no fundo e ficou cru em cima.","Fogo alto depois de tampar. Fogo baixo, e panela de fundo grosso ajuda."],
    ["Ficou duro e a água acabou.","Junte um quarto de xícara de água quente, tampe e deixe mais cinco minutos em fogo baixo."],
    ["O alho amargou.","Queimou. Jogue fora o refogado e comece de novo: o amargo passa para a panela toda."]]});
A("m3","arroz-legumes","Arroz com legumes",{min:35,ensina:["absorcao"],
  ideia:"A técnica do arroz aceita companhia: legumes cortados pequenos entram junto e cozinham no mesmo tempo. A regra é o tamanho, porque o cubo de cenoura tem que ficar macio nos mesmos quinze minutos do arroz. Legume que solta água, como tomate e abobrinha, pede um pouco menos de água na panela.",
  observar:["Cubos de cenoura do tamanho de um grão de milho cozinham junto com o arroz.","Os legumes refogam um minuto antes do arroz para pegar o sabor da base.","A proporção de água continua duas para uma, medida pelo arroz.","No fim, o cubo de cenoura amassa fácil entre os dedos."],
  ing:[I(1.5,"xíc","arroz branco"),I(3,"xíc","água quente"),I(1,"","cenoura em cubos pequenos"),I(.5,"xíc","ervilha ou milho","congelados ou em lata, escorridos"),I(.5,"","cebola picada"),I(2,"dente","alho picado"),I(1,"c. sopa","óleo"),I(1,"c. chá","sal")],
  ut:["Panela média com tampa","Colher de pau","Chaleira","Garfo"],
  passos:[P("Corte a cenoura em cubos pequenos e iguais. Esquente a água."),
    P("Refogue a cebola no óleo.",2,120,"cebola transparente"),
    P("Junte o alho e a cenoura e mexa.",2,60,"cheiro de alho, cenoura brilhante"),
    P("Junte o arroz e mexa até brilhar.",2,60),
    P("Despeje a água quente, o sal e a ervilha ou o milho. Mexa uma vez e prove a água.",3,null,"ferveu e está levemente salgada"),
    P("Fogo baixo, tampa com frestinha, sem mexer.",1,900,"furinhos na superfície, sem som de água"),
    P("Desligue, tampe e deixe descansar. Solte com o garfo.",null,300)],
  erros:[["A cenoura ficou dura.","Os cubos estavam grandes. Corte menor, do tamanho de um grão de milho."],
    ["Ficou aguado.","Legumes soltam água. Com abobrinha ou tomate, tire um quarto de xícara da água."],
    ["Ficou sem gosto.","Faltou sal na água. Prove a água antes de tampar, sempre."]]});
A("m3","couve","Couve refogada",{min:15,ensina:["refogar","faca"],
  ideia:"O refogado também é um jeito de cozinhar folhas, e aí ele é rápido: fogo alto e um minuto, só até murchar. A couve treina dois gestos: o corte fino, com as folhas enroladas como um charuto, e a coragem de tirar do fogo quando ainda está verde vivo. Um minuto a mais e ela fica escura e amarga.",
  observar:["O rolo de folhas bem apertado dá tiras finas e iguais.","O alho entra no azeite e a couve entra logo atrás: vinte segundos.","Couve pronta: murchou, brilha e está verde vivo.","Verde escuro e cheiro forte de repolho: passou."],
  ing:[I(1,"","maço de couve"),I(3,"dente","alho fatiado"),I(2,"c. sopa","azeite"),I(.5,"c. chá","sal")],
  ut:["Frigideira grande ou panela larga","Faca afiada e tábua","Pegador ou colher de pau"],
  passos:[P("Lave as folhas e tire o talo grosso do meio com a faca."),
    P("Empilhe quatro ou cinco folhas, enrole apertado como um charuto e corte em tiras bem finas, com a mão em garra."),
    P("Aqueça o azeite e junte o alho.",3,20,"o alho chia e perfuma, ainda claro"),
    P("Junte toda a couve e o sal e mexa sem parar, trazendo de baixo para cima.",3,90,"murchou e está verde vivo e brilhante"),
    P("Tire da frigideira na hora e sirva.")],
  erros:[["Ficou escura e amarga.","Tempo demais no fogo. A couve fica pronta em pouco mais de um minuto."],
    ["Soltou água e cozinhou em vez de refogar.","Folha molhada ou frigideira pequena. Seque as folhas e use a frigideira mais larga."],
    ["As tiras ficaram grossas e duras.","Enrole mais apertado e avance a garra bem pouco a cada corte."]]});

A("m4","feijao-pressao","Panela de pressão sem medo",{prato:"Feijão cozido",min:75,ensina:["pressao"],
  ideia:"A panela de pressão cozinha em um terço do tempo porque prende o vapor. Ela é segura quando você respeita três regras: nunca encher além de dois terços, baixar o fogo quando começar a chiar, e só abrir depois que o pino baixar sozinho e não sair mais vapor. Nunca force a tampa e nunca ponha a panela debaixo da torneira para apressar.",
  observar:["Antes de usar: a borracha da tampa está inteira e a válvula está limpa, dá para ver luz pelo furo.","Chiado constante e válvula girando: pegou pressão. Baixe o fogo e comece a contar.","Pino baixo e silêncio: pode abrir. A tampa deve girar sem força nenhuma.","Feijão cozido amassa fácil entre dois dedos, sem miolo duro."],
  ing:[I(2,"xíc","feijão carioca"),I(6,"xíc","água"),I(2,"","folhas de louro")],
  ut:["Panela de pressão","Escorredor","Concha"],
  passos:[P("Espalhe o feijão na bancada, tire pedrinhas e grãos estragados e lave no escorredor."),
    P("Confira a panela: borracha inteira, válvula limpa. Ponha o feijão, a água e o louro. O nível não pode passar de dois terços da panela."),
    P("Feche a tampa até travar e leve ao fogo.",3,null,"a panela chia de forma constante e a válvula gira"),
    P("Baixe o fogo e marque o tempo.",1,1500),
    P("Desligue o fogo e espere a pressão sair sozinha. Não mexa na válvula e não force a tampa.",null,900,"o pino baixou e não sai mais vapor nenhum"),
    P("Abra a tampa virando o rosto para o lado. Amasse um grão entre os dedos.",null,null,"o grão amassa fácil, sem miolo duro")],
  erros:[["O feijão ficou duro.","Feijão velho demora mais. Feche de novo e cozinhe mais dez minutos depois de pegar pressão. Deixar de molho por oito horas ajuda."],
    ["Saiu espuma pela válvula.","Panela cheia demais ou fogo alto depois de pegar pressão. Respeite os dois terços e baixe o fogo."],
    ["A tampa não abre.","Ainda há pressão. Espere mais. Nunca force."],
    ["O feijão desmanchou.","Tempo demais. Da próxima, cinco minutos a menos."]]});
A("m4","feijao-temperado","Feijão temperado de caldo grosso",{min:25,ensina:["temperar-feijao"],

  ut:["Frigideira","Colher de pau","Concha","Garfo"],
  passos:[P("Aqueça o óleo na frigideira e refogue a cebola.",2,120,"cebola transparente"),
    P("Junte o alho e mexa.",2,45,"alho dourado claro e cheiroso"),
    P("Passe duas conchas de feijão com pouco caldo para a frigideira e amasse os grãos com o garfo, misturando ao refogado.",2),
    P("Devolva tudo para a panela do feijão, mexa e deixe ferver sem tampa, mexendo de vez em quando.",1,600,"o caldo engrossou e cobre as costas da colher"),
    P("Junte o sal aos poucos, prove e ajuste. Finalize com o cheiro-verde.")],
  erros:[["O caldo ficou ralo.","Amasse mais uma concha de grãos e ferva mais cinco minutos sem tampa."],
    ["Ficou salgado.","Junte um pouco de água quente e mais feijão sem tempero, se tiver. Da próxima, salgue só no fim."],
    ["Grudou no fundo.","Caldo grosso queima fácil. Fogo baixo e mexer raspando o fundo."]]});
A("m4","prato-feito","O prato feito completo",{prato:"Prato feito: arroz, feijão, ovo e salada",min:50,ensina:["planejar"],
  ideia:"Fazer vários pratos juntos é uma questão de ordem. Comece pelo que demora mais e cozinha sozinho, use esse tempo para o que é frio, e deixe por último o que esfria rápido. No prato feito: o feijão esquenta devagar, o arroz cozinha tampado, a salada é montada enquanto isso e o ovo é frito no último minuto.",
  observar:["Antes de começar, diga a ordem em voz alta ou escreva num papel.","Enquanto o arroz está tampado, suas mãos estão livres: é a hora da salada.","O ovo frito leva três minutos e esfria em dois: é sempre o último.","Tudo chega quente à mesa ao mesmo tempo. Essa é a prova."],
  ing:[I(1.5,"xíc","arroz branco"),I(3,"xíc","água quente"),I(.5,"","cebola picada"),I(2,"dente","alho picado"),I(2,"c. sopa","óleo"),I(1,"c. chá","sal"),I(null,"","feijão temperado pronto","da aula anterior"),I(3,"","ovos"),I(.5,"","pé de alface"),I(2,"","tomates"),I(1,"c. sopa","suco de limão"),I(3,"c. sopa","azeite")],
  ut:["Panela média com tampa","Panela do feijão","Frigideira com tampa","Tigela de salada","Faca e tábua"],
  passos:[P("Separe tudo e defina a ordem: feijão, arroz, salada, ovo."),
    P("Ponha o feijão para esquentar, tampado, mexendo de vez em quando.",1),
    P("Faça o arroz até o ponto de tampar, como na aula do arroz branco: refogue cebola e alho, junte o arroz, a água quente e o sal.",2,null,"a água ferveu; baixe o fogo e tampe"),
    P("Com o arroz tampado em fogo baixo, lave e seque a alface, corte o tomate e prepare o molho num pote. Não tempere ainda.",1,900,"arroz com furinhos e sem som de água"),
    P("Desligue o arroz e deixe tampado. Frite os ovos como na aula do ovo frito.",2,180,"clara firme, gema mole"),
    P("Tempere a salada, monte os pratos e sirva na hora.")],
  erros:[["O arroz ficou pronto e o resto não.","Arroz espera bem: tampado, fica quente por vinte minutos. Ovo e salada temperada é que não esperam."],
    ["Faltou boca de fogão.","O feijão só precisa esquentar: tire do fogo quando ferver e deixe tampado."],
    ["Você se perdeu no meio.","Escreva a ordem num papel e risque cada etapa. Com o tempo a ordem fica na cabeça."]]});

// ===== Módulo 5: massas e molhos =====
A("m5","alho-e-oleo","Massa al dente",{prato:"Espaguete ao alho e óleo",min:25,ensina:["al-dente","emulsionar"],
  ideia:"Massa pede muita água, fervendo forte e salgada: é a única chance de temperar a massa por dentro. Al dente quer dizer macia por fora com uma leve resistência no centro, e para chegar lá você tira um minuto antes do tempo da embalagem, porque ela termina de cozinhar no molho. E guarde sempre uma xícara da água do cozimento: o amido dela transforma azeite em molho.",
  observar:["A água salgada deve ter gosto de caldo bem temperado.","Morda um fio: macio por fora, com um pontinho mais firme no meio.","O alho fatiado doura devagar em fogo baixo. Dourado claro é o ponto; marrom amarga.","Com a água da massa, o azeite deixa de ser óleo solto e vira um molho brilhante que gruda no fio."],
  ing:[I(300,"g","espaguete"),I(6,"dente","alho fatiado fino"),I(5,"c. sopa","azeite"),I(1,"c. sopa","sal","para a água"),I(2,"c. sopa","salsinha picada")],
  ut:["Panela grande","Frigideira grande","Escorredor","Xícara","Pegador"],
  passos:[P("Encha a panela grande com uns três litros de água, tampe e leve para ferver.",3,null,"bolhas grandes subindo sem parar"),
    P("Junte o sal e o espaguete. Mexa no primeiro minuto para os fios não grudarem.",3),
    P("Cozinhe um minuto a menos que o tempo da embalagem. O timer está em 9 minutos.",3,540,"um fio mordido está macio, com um pontinho firme no centro"),
    P("Enquanto isso, ponha o azeite e o alho na frigideira ainda fria e leve ao fogo.",1,180,"o alho está dourado claro; desligue o fogo"),
    P("Tire uma xícara da água do cozimento e reserve. Escorra a massa."),
    P("Passe a massa para a frigideira, junte meia xícara da água reservada e mexa com o pegador.",2,60,"o molho ficou brilhante e gruda no fio"),
    P("Desligue, junte a salsinha, prove o sal e sirva.")],
  erros:[["O alho queimou e amargou.","Comece com frigideira fria e fogo baixo, e desligue no dourado claro. Queimou, refaça: leva três minutos."],
    ["A massa ficou mole.","Passou do tempo. Tire um minuto antes do que diz a embalagem e prove um fio."],
    ["Ficou oleosa e sem molho.","Faltou a água do cozimento. Junte aos poucos e mexa em fogo médio até brilhar."],
    ["A massa grudou toda.","Pouca água ou faltou mexer no primeiro minuto."]]});
A("m5","molho-de-tomate","Reduzir: molho de tomate caseiro",{prato:"Penne ao molho de tomate",min:40,ensina:["reduzir"],
  ideia:"Reduzir é deixar a água evaporar em fogo baixo, sem tampa, até o sabor concentrar e o molho ganhar corpo. O molho de tomate começa ralo e ácido e, vinte minutos depois, está grosso e adocicado sem que você tenha feito nada além de esperar e mexer. O ponto se vê com a colher: ela abre um caminho no fundo da panela que demora a fechar.",
  observar:["Fervura suave: bolhas preguiçosas que estouram de vez em quando.","O molho escurece de vermelho vivo para vermelho fechado.","A colher passa no fundo e o caminho fica aberto por dois segundos.","Prove: se ainda arde de ácido, uma pitada de açúcar corrige."],
  ing:[I(800,"g","tomate pelado em lata","duas latas"),I(.5,"","cebola picada"),I(3,"dente","alho picado"),I(3,"c. sopa","azeite"),I(1,"c. chá","sal"),I(.5,"c. chá","açúcar","só se precisar"),I(6,"","folhas de manjericão","opcional"),I(300,"g","penne"),I(1,"c. sopa","sal","para a água")],
  ut:["Panela média","Panela grande","Colher de pau","Escorredor"],
  passos:[P("Refogue a cebola no azeite.",2,120,"cebola transparente"),
    P("Junte o alho e mexa.",2,30,"cheiro de alho"),
    P("Junte os tomates com o caldo da lata e amasse com a colher de pau. Junte o sal.",2,null,"começou a ferver"),
    P("Baixe o fogo e deixe reduzir sem tampa, mexendo a cada poucos minutos. Ponha a água da massa para ferver na outra panela.",1,1200,"a colher abre um caminho no fundo que demora a fechar"),
    P("Cozinhe o penne na água fervente e salgada, um minuto a menos que a embalagem.",3,600,"macio com leve resistência"),
    P("Prove o molho. Se estiver ácido, junte o açúcar. Rasgue o manjericão por cima."),
    P("Escorra a massa, junte ao molho e mexa em fogo médio.",2,60,"o molho cobre cada penne")],
  erros:[["Ficou ácido.","Reduziu pouco ou o tomate era ácido. Mais dez minutos de fogo baixo e uma pitada de açúcar."],
    ["Ficou aguado.","Faltou reduzir. O molho precisa de panela destampada."],
    ["Espirrou molho no fogão.","Fogo alto demais. Fervura suave, e uma tampa meio aberta ajuda."],
    ["Queimou no fundo.","Molho grosso gruda. Mexa raspando o fundo e mantenha o fogo baixo."]]});
A("m5","molho-branco","Molho branco sem grumos",{prato:"Parafuso ao molho branco",min:30,ensina:["roux"],
  ideia:"Farinha cozida na manteiga engrossa qualquer líquido: essa mistura se chama roux e é a base do molho branco. Dois cuidados evitam os grumos: cozinhar a farinha por dois minutos para perder o gosto de cru, e juntar o leite aos poucos, mexendo sem parar, esperando alisar antes de pôr mais. O molho só engrossa de verdade quando ferve.",
  observar:["A farinha na manteiga vira uma pasta que borbulha e cheira a biscoito.","A pasta não deve escurecer: fogo baixo.","A cada porção de leite, a mistura empelota e depois alisa. Só então ponha mais.","Molho pronto: cobre as costas da colher, e o risco do dedo fica marcado."],
  ing:[I(2,"c. sopa","manteiga"),I(2,"c. sopa","farinha de trigo"),I(500,"ml","leite"),I(.5,"c. chá","sal"),I(null,"","noz-moscada","uma pitada, opcional"),I(50,"g","queijo parmesão ralado"),I(300,"g","macarrão parafuso"),I(1,"c. sopa","sal","para a água")],
  ut:["Panela média","Panela grande","Batedor de arame (fouet) ou colher de pau","Escorredor"],
  passos:[P("Ponha a água da massa para ferver na panela grande.",3),
    P("Na panela média, derreta a manteiga, junte a farinha e mexa sem parar.",1,120,"uma pasta que borbulha e cheira a biscoito, sem escurecer"),
    P("Junte um pouco do leite, cerca de meia xícara, e mexa até alisar. Repita até acabar o leite.",1,null,"líquido liso, sem pelotas"),
    P("Aumente o fogo e mexa até ferver e engrossar.",2,300,"o molho cobre as costas da colher"),
    P("Desligue, junte o sal, a noz-moscada e o queijo. Prove."),
    P("Cozinhe o parafuso na água fervente e salgada, um minuto a menos que a embalagem.",3,540,"macio com leve resistência"),
    P("Escorra a massa e misture ao molho.")],
  erros:[["Empelotou.","O leite entrou de uma vez. Bata forte com o batedor ou passe o molho por uma peneira. Da próxima, aos poucos."],
    ["Ficou com gosto de farinha crua.","A farinha cozinhou pouco na manteiga. Dois minutos, mexendo."],
    ["Ficou grosso demais.","Junte leite aos poucos, mexendo, até o ponto. O molho também engrossa ao esfriar."],
    ["Ficou ralo.","Não ferveu. O molho só engrossa na fervura: mais alguns minutos mexendo."]]});

// ===== Módulo 6: carnes na frigideira =====
A("m6","bife-acebolado","Selar: bife acebolado",{prato:"Bife acebolado",min:25,ensina:["selar"],
  ideia:"Selar é dourar a superfície da carne em frigideira muito quente. A crosta marrom é onde mora o sabor, e ela só se forma se a carne estiver seca, a frigideira quente de verdade e você não mexer. Depois vem o passo que quase todo mundo pula: deixar a carne descansar uns minutos, para o suco se assentar em vez de escorrer no prato.",
  observar:["Carne seca com papel: carne molhada cozinha no vapor e fica cinza.","Frigideira pronta: o óleo ondula e solta o primeiro fio de fumaça.","Chiado alto e constante quando o bife entra. Se o chiado morrer, a frigideira está cheia demais.","O bife solta sozinho da frigideira quando a crosta formou. Se está grudado, ainda não é hora de virar."],
  ing:[I(450,"g","bifes de alcatra ou contrafilé","três bifes de um dedo de altura"),I(2,"","cebolas em rodelas"),I(2,"c. sopa","óleo"),I(1,"c. chá","sal"),I(null,"","pimenta-do-reino")],
  ut:["Frigideira grande e pesada","Pegador","Papel-toalha","Prato para o descanso"],
  passos:[P("Tire os bifes da geladeira quinze minutos antes. Seque bem os dois lados com papel-toalha.",null,900),
    P("Aqueça a frigideira com metade do óleo.",3,120,"o óleo ondula e solta o primeiro fio de fumaça"),
    P("Salgue os bifes na hora e coloque na frigideira, sem encostar um no outro. Não mexa.",3,120,"crosta marrom embaixo; o bife solta sozinho da frigideira"),
    P("Vire com o pegador e doure o outro lado.",3,90,"ao apertar com o dedo, o bife cede e volta devagar: ao ponto"),
    P("Passe os bifes para o prato e deixe descansar.",null,180),
    P("Na mesma frigideira, sem lavar, junte o resto do óleo e as cebolas com uma pitada de sal.",2,240,"cebolas macias e douradas nas bordas"),
    P("Junte duas colheres de sopa de água e raspe o fundo com a colher para soltar o dourado. Despeje as cebolas e o caldo sobre os bifes.",2)],
  erros:[["O bife ficou cinza e soltou água.","Frigideira fria, carne molhada ou bifes demais de uma vez. Seque, espere a fumacinha e frite em duas levas se precisar."],
    ["Ficou duro.","Passou do ponto ou o corte era fino demais. Bife de um dedo, dois minutos de um lado e um e meio do outro."],
    ["Fez muita fumaça.","Selar faz fumaça mesmo. Abra a janela e ligue o exaustor antes."],
    ["O suco escorreu todo no prato.","Faltou o descanso. Três minutos antes de cortar."]]});
A("m6","frango-grelhado","Frango grelhado suculento",{min:40,ensina:["grelhar"],
  ideia:"Frango tem um ponto só: totalmente cozido. O problema é que o peito seca fácil, então o truque é deixar o filé com a mesma altura em toda a extensão, para a ponta fina não ressecar enquanto a parte grossa cozinha. O fogo aqui é médio, não alto: o frango precisa de tempo para o calor chegar ao centro sem queimar por fora.",
  observar:["Filé da mesma altura de ponta a ponta, mais ou menos um dedo.","Dourado embaixo e a lateral do filé branca até a metade: hora de virar.","Ponto seguro: corte a parte mais grossa. Branco por inteiro, suco transparente, nenhum rosado.","Lave a tábua e a faca que tocaram o frango cru antes de usar para outra coisa."],
  ing:[I(500,"g","filés de peito de frango","três filés"),I(2,"dente","alho amassado"),I(1,"","limão"),I(1,"c. chá","sal"),I(2,"c. sopa","azeite"),I(null,"","pimenta-do-reino")],
  ut:["Frigideira grande","Pegador","Tábua só para o frango","Faca","Papel-toalha"],
  passos:[P("Se o filé for alto, corte ao meio na horizontal, abrindo como um livro, ou bata com o fundo de uma panela entre dois plásticos, até ter um dedo de altura por igual."),
    P("Tempere com o alho, o suco do limão, o sal e a pimenta. Deixe descansar. Lave as mãos, a tábua e a faca.",null,900),
    P("Seque os filés com papel-toalha. Aqueça a frigideira com o azeite.",2,90,"o azeite corre solto"),
    P("Coloque os filés sem encostar um no outro e não mexa.",2,300,"dourado embaixo e lateral branca até a metade"),
    P("Vire e grelhe o outro lado.",2,300,"cortando a parte mais grossa: branco por inteiro, suco transparente"),
    P("Passe para um prato limpo e deixe descansar antes de servir.",null,180)],
  erros:[["Ficou seco.","Filé fino demais ou tempo demais. Deixe na altura de um dedo e confira o ponto aos cinco minutos do segundo lado."],
    ["Dourou por fora e ficou rosado por dentro.","Fogo alto ou filé grosso. Volte à frigideira em fogo baixo, com tampa, por mais três minutos. Nunca sirva frango rosado."],
    ["Grudou na frigideira.","Você tentou virar cedo. Quando doura, solta sozinho."]]});
A("m6","carne-moida","Carne moída refogada",{min:30,ensina:["dourar"],
  ideia:"Carne moída solta muita água. Se você mexe sem parar desde o começo, ela cozinha nesse caldo e fica cinza e sem gosto. O certo é espalhar na panela quente, deixar dourar por baixo e esperar a água secar: o som muda de fervura para fritura, e é aí que o sabor aparece. Só então entram a cebola, o alho e o tomate.",
  observar:["Panela larga: a carne em camada fina doura; amontoada, cozinha.","O som muda: primeiro um chiado molhado, depois estalos secos de fritura.","A carne passa de rosa para cinza e depois para marrom dourado. Pare no marrom.","Nenhum pedaço rosado no final."],
  ing:[I(500,"g","carne moída","patinho ou acém"),I(1,"","cebola picada"),I(3,"dente","alho picado"),I(2,"","tomates picados"),I(1,"c. sopa","extrato de tomate"),I(1,"c. sopa","óleo"),I(1,"c. chá","sal"),I(.5,"c. chá","cominho","opcional"),I(2,"c. sopa","cheiro-verde picado")],
  ut:["Panela larga ou frigideira funda","Colher de pau"],
  passos:[P("Aqueça o óleo na panela.",3,90,"o óleo ondula"),
    P("Espalhe a carne em uma camada e não mexa.",3,120,"dourou por baixo"),
    P("Quebre a carne com a colher e mexa de vez em quando, até a água secar.",3,360,"o som virou fritura e a carne está marrom, sem rosado"),
    P("Baixe o fogo, abra um espaço no meio, junte a cebola e refogue. Depois o alho.",2,180,"cebola macia e cheiro de alho"),
    P("Junte o tomate, o extrato, o sal e o cominho. Misture tudo.",2),
    P("Cozinhe até o tomate desmanchar. Se secar demais, junte um pouco de água.",1,300,"molho curto e brilhante envolvendo a carne"),
    P("Prove o sal e finalize com o cheiro-verde.")],
  erros:[["Ficou cinza e sem gosto.","Panela pequena ou você mexeu cedo. Panela larga, fogo alto e paciência até a água secar."],
    ["Ficou em pelotas grandes.","Quebre com a colher logo depois de dourar o primeiro lado."],
    ["Ficou seca.","Faltou o tomate desmanchar ou passou do tempo. Um pouco de água e dois minutos de fogo baixo."]]});

// ===== Módulo 7: legumes =====
A("m7","legumes-assados","Legumes assados",{min:50,ensina:["assar"],
  ideia:"Calor seco e forte transforma legume: a água evapora, o açúcar natural carameliza e as bordas ficam douradas. Três regras decidem tudo: forno bem quente e pré-aquecido, pedaços do mesmo tamanho e uma camada só na assadeira. Amontoado, o legume solta vapor e cozinha em vez de assar. Na airfryer a lógica é a mesma, com menos tempo.",
  observar:["Pedaços do tamanho de uma mordida grande, todos parecidos.","Cada pedaço brilha de azeite, sem poça no fundo da tigela.","Espaço entre os pedaços na assadeira. Não coube? Use duas.","Pronto: bordas douradas e o garfo entra sem resistência."],
  ing:[I(2,"","batatas"),I(2,"","cenouras"),I(1,"","abobrinha"),I(1,"","cebola"),I(3,"c. sopa","azeite"),I(1,"c. chá","sal"),I(1,"c. chá","orégano ou alecrim")],
  ut:["Assadeira grande","Tigela grande","Faca e tábua","Espátula","Luva térmica"],
  passos:[P("Ligue o forno a 220 graus e deixe pré-aquecer. Na airfryer, 200 graus por três minutos.",null,600),
    P("Corte as batatas e as cenouras em pedaços de três centímetros, a abobrinha em meias-luas grossas e a cebola em gomos."),
    P("Na tigela, misture os legumes com o azeite, o sal e o orégano, usando as mãos.",null,null,"todos os pedaços brilham"),
    P("Espalhe na assadeira em uma camada só, com espaço entre os pedaços."),
    P("Asse na grade do meio. Na airfryer, são 10 minutos em vez de 15.",null,900,"a parte de baixo começou a dourar"),
    P("Vire os pedaços com a espátula e asse mais. Na airfryer, sacuda o cesto e deixe mais 8 a 10 minutos.",null,900,"bordas douradas, garfo entra fácil"),
    P("Prove o sal e sirva.")],
  erros:[["Ficaram moles e pálidos.","Assadeira cheia demais ou forno frio. Uma camada só e pré-aquecimento completo."],
    ["Uns queimaram e outros ficaram crus.","Pedaços de tamanhos diferentes. Corte tudo parecido; cenoura um pouco menor que batata."],
    ["Grudaram na assadeira.","Pouco azeite ou você virou cedo. Espere dourar embaixo antes de virar."]]});
A("m7","pure","Purê de batata",{min:40,ensina:["amassar"],
  ideia:"Purê bom depende de três detalhes. A batata começa em água fria, para cozinhar por igual até o centro. Depois de cozida, ela é bem escorrida, porque água sobrando deixa o purê aguado. E é amassada ainda quente, com manteiga e leite quente. Só não bata demais: batata muito trabalhada vira uma cola elástica.",
  observar:["Pedaços iguais, para cozinharem no mesmo tempo.","Batata pronta: o garfo entra e sai sem nenhuma resistência e o pedaço quase se parte.","Depois de escorrer, a batata fica opaca e seca na superfície.","Purê pronto: liso, macio, cai da colher em bloco."],
  ing:[I(600,"g","batatas","umas quatro médias"),I(2,"c. sopa","manteiga"),I(150,"ml","leite quente"),I(1,"c. chá","sal"),I(null,"","noz-moscada","opcional")],
  ut:["Panela média","Escorredor","Amassador de batata ou garfo","Colher de pau","Descascador"],
  passos:[P("Descasque as batatas e corte em pedaços iguais, de uns quatro centímetros."),
    P("Ponha na panela, cubra com água fria, junte metade do sal e leve para ferver.",3,null,"ferveu"),
    P("Baixe para fogo médio e cozinhe.",2,1080,"o garfo entra sem resistência e o pedaço quase se parte"),
    P("Escorra muito bem e devolva as batatas para a panela quente, com o fogo desligado, por um minuto, para secar.",null,60,"superfície opaca e seca"),
    P("Amasse ainda quente, até não ter pedaços. Junte a manteiga e misture."),
    P("Junte o leite quente aos poucos, mexendo com a colher de pau, até a textura que você gosta. Acerte o sal e prove.",null,null,"liso e macio, cai da colher em bloco")],
  erros:[["Ficou com pelotas.","A batata cozinhou pouco ou esfriou antes de amassar. Cozinhe até quase desmanchar e amasse na hora."],
    ["Ficou aguado.","Faltou escorrer e secar, ou leite demais. O leite entra aos poucos."],
    ["Ficou elástico, como cola.","Foi batido demais. Nada de liquidificador ou mixer: só amassador e colher."]]});
A("m7","brocolis-alho","Vapor e salteado: brócolis no alho",{prato:"Brócolis no alho",min:20,ensina:["vapor","saltear"],
  ideia:"Duas técnicas rápidas, uma depois da outra. No vapor, o legume cozinha acima da água, sem perder cor nem sabor para ela. No salteado, fogo alto e um minuto de frigideira dão o sabor do alho e as bordas tostadas. O ponto do vapor é curto: verde vivo e ainda firme. Passou disso, o brócolis fica verde-oliva e mole.",
  observar:["Buquês do mesmo tamanho; os talos também se comem, descascados e fatiados.","A água ferve embaixo, sem tocar no brócolis.","Ponto do vapor: verde vivo, e o garfo entra com uma leve resistência.","No salteado, o alho entra vinte segundos antes do brócolis, e nada fica parado."],
  ing:[I(1,"","brócolis ninja"),I(3,"dente","alho fatiado"),I(2,"c. sopa","azeite"),I(.5,"c. chá","sal")],
  ut:["Panela com tampa","Cesto de vapor ou escorredor de metal que encaixe na panela","Frigideira grande","Pegador"],
  passos:[P("Separe o brócolis em buquês de uma mordida. Descasque o talo e corte em fatias."),

A("m8","frango-assado","Frango assado com batatas",{min:90,ensina:["forno"],
  ideia:"O forno cozinha com ar quente, devagar e por todos os lados. Ele precisa estar na temperatura antes de a comida entrar, e a grade do meio é o lugar onde o calor é mais uniforme. Cada vez que você abre a porta, a temperatura cai, então espie pelo vidro. O tempo da receita é uma estimativa: quem decide é o ponto, e no frango o ponto se confere furando perto do osso.",
  observar:["Pré-aquecer leva de dez a quinze minutos. Entrar em forno frio resseca a carne.","A pele para cima fica exposta ao calor e doura.","Ponto seguro: fure a parte mais grossa, perto do osso. O suco sai claro, sem nenhum rosado.","A batata embaixo cozinha no caldo do frango: garfo entra fácil e as bordas douram."],
  ing:[I(6,"","sobrecoxas de frango com pele e osso"),I(4,"","batatas em gomos"),I(1,"","cebola em gomos"),I(4,"dente","alho amassado"),I(1,"","limão"),I(2,"c. sopa","azeite"),I(1.5,"c. chá","sal"),I(1,"c. chá","páprica doce"),I(null,"","pimenta-do-reino")],
  ut:["Assadeira grande","Tigela","Luva térmica","Faca de ponta ou garfo"],

    P("Ligue o forno a 200 graus quando faltarem quinze minutos do descanso."),
    P("Espalhe as batatas e a cebola na assadeira com o resto do sal e um fio de azeite. Ponha o frango por cima, com a pele para cima."),
    P("Asse na grade do meio, sem abrir a porta na primeira meia hora.",null,3000,"pele dourada e batatas macias"),
    P("Fure a sobrecoxa mais grossa perto do osso.",null,null,"o suco sai claro, sem rosado. Se sair rosado, mais dez minutos"),
    P("Tire do forno com a luva e deixe descansar antes de servir.",null,300)],
  erros:[["A pele ficou pálida.","Forno fraco ou frango molhado. Seque a pele antes de temperar e, nos últimos cinco minutos, suba para 230 graus."],
    ["O suco saiu rosado.","Não está pronto. Volte ao forno por mais dez minutos e teste de novo."],
    ["A batata ficou dura.","Gomos grossos demais. Corte cada batata em oito."],
    ["Ressecou.","Passou do tempo. Comece a testar o ponto aos quarenta e cinco minutos."]]});
A("m8","bolo-de-cenoura","Bolo de cenoura com cobertura",{min:75,ensina:["bolo"],
  ideia:"Bolo é a receita em que medir importa de verdade: aqui a xícara é rasa e ninguém troca quantidade no olho. Três regras valem para quase todo bolo: misturar a farinha só até sumir, porque bater demais deixa o bolo duro; pôr o fermento por último; e não abrir o forno nos primeiros vinte e cinco minutos, senão o bolo murcha. Deixe a porção em 3: a receita rende um bolo inteiro.",
  observar:["O creme do liquidificador fica liso e laranja, sem pedaços de cenoura.","A massa pronta cai da colher em fita grossa.","Bolo pronto: dourado, soltando das laterais da forma, e o palito enfiado no meio sai seco.","A cobertura está no ponto quando ferve e cobre as costas da colher."],

  ut:["Liquidificador","Tigela grande","Forma com furo no meio","Peneira","Colher de pau ou espátula","Panela pequena","Palito de dente"],
  passos:[P("Ligue o forno a 180 graus. Passe manteiga em toda a forma e polvilhe farinha, batendo para tirar o excesso."),
    P("Bata no liquidificador a cenoura, os ovos e o óleo.",null,180,"creme liso, sem pedaços"),
    P("Passe para a tigela e misture o açúcar."),
    P("Peneire a farinha sobre a massa, em três vezes, misturando com a colher só até a farinha sumir.",null,null,"massa lisa, caindo em fita grossa"),
    P("Junte o fermento e misture de leve. Despeje na forma."),
    P("Asse na grade do meio, sem abrir o forno nos primeiros 25 minutos.",null,2400,"o palito enfiado no meio sai seco"),
    P("Deixe esfriar na forma por dez minutos e desenforme sobre um prato.",null,600),
    P("Na panela pequena, misture os ingredientes da cobertura e mexa até ferver e engrossar.",1,180,"cobre as costas da colher"),
    P("Despeje a cobertura quente sobre o bolo.")],
  erros:[["Murchou no meio.","O forno foi aberto cedo ou o bolo saiu cru. Só abra depois de 25 minutos e faça o teste do palito."],
    ["Ficou duro e pesado.","A farinha foi batida demais ou medida com montinho. Xícara rasa e misturar só até sumir."],
    ["Grudou na forma.","Faltou untar algum canto. Manteiga e farinha em toda a forma, e desenformar morno."],
    ["Queimou por fora e ficou cru por dentro.","Forno quente demais. Confira os 180 graus e use a grade do meio."]]});
A("m8","escondidinho","Gratinar: escondidinho de carne",{prato:"Escondidinho de carne moída",min:80,ensina:["gratinar"],

  observar:["A carne deve estar com molho curto: se estiver aguada, o escondidinho desmonta.","O purê um pouco mais mole que o normal espalha melhor.","Riscar o purê com o garfo cria pontas que douram.","Pronto: queijo dourado e molho borbulhando nas bordas do refratário."],

  ut:["Panela larga","Panela média","Refratário médio","Amassador de batata","Escorredor","Luva térmica"],
  passos:[P("Ponha as batatas descascadas e cortadas para cozinhar em água fria com sal, como na aula do purê.",2,1200,"o garfo entra sem resistência"),
    P("Enquanto isso, faça a carne moída como na aula: doure a carne, junte cebola, alho, tomate e extrato, e cozinhe até o molho ficar curto.",3,null,"carne marrom, sem rosado, com molho curto"),
    P("Ligue o forno a 220 graus."),
    P("Escorra as batatas, amasse quentes com a manteiga e junte o leite quente e o sal.",null,null,"purê liso, um pouco mais mole que o normal"),
    P("No refratário, espalhe a carne. Cubra com o purê, alise e risque a superfície com o garfo. Espalhe o queijo."),
    P("Leve ao forno na grade de cima.",null,1200,"queijo dourado e borbulhando nas bordas"),
    P("Deixe descansar cinco minutos antes de servir: sai do forno muito quente.",null,300)],
  erros:[["Desmontou ao servir.","Carne com molho demais ou faltou o descanso. Reduza bem o molho e espere cinco minutos."],
    ["O queijo não dourou.","Forno fraco ou grade baixa. 220 graus e grade de cima."],
    ["O purê afundou na carne.","Purê ralo. Menos leite da próxima vez."]]});

A("m9","sopa-de-legumes","Sopa de legumes",{min:50,ensina:["ensopar"],
  ideia:"Cozinhar em líquido, devagar e com tampa, tira o sabor dos ingredientes e passa para o caldo. A ordem de entrada na panela segue a dureza: primeiro o que demora, por último o que cozinha rápido. A fervura é suave, com poucas bolhas, porque fervura forte desmancha os legumes e turva o caldo. E o sal final espera o fim, já que o caldo reduz.",
  observar:["O refogado do começo é o que dá sabor ao caldo. Sem ele, a sopa tem gosto de água.","Fervura suave: bolhas pequenas subindo devagar.","Batata e cenoura entram primeiro; abobrinha e macarrão, nos últimos minutos.","Pronto: a cenoura amassa na colher e o caldo tem gosto mesmo sem os legumes."],

  ut:["Panela funda com tampa","Colher de pau","Concha","Faca e tábua"],

    P("Refogue a cebola no azeite, depois o alho.",2,150,"cebola transparente e cheiro de alho"),
    P("Junte o tomate, a cenoura e a batata e mexa.",2,120,"os legumes brilham e o tomate começa a desmanchar"),
    P("Junte a água quente e metade do sal.",3,null,"ferveu"),
    P("Baixe o fogo e tampe, deixando uma fresta.",1,1200,"a cenoura está quase macia"),
    P("Junte a abobrinha e o macarrão.",1,480,"macarrão macio e a cenoura amassa na colher"),
    P("Prove o caldo, acerte o sal e junte o cheiro-verde.")],
  erros:[["Ficou sem gosto.","Refogado apressado ou pouco sal. Sal, um fio de azeite e umas gotas de limão no prato ajudam."],
    ["Os legumes desmancharam.","Fervura forte ou tempo demais. Fogo baixo depois de ferver."],
    ["O macarrão bebeu o caldo todo.","Macarrão continua inchando. Junte água quente e sirva logo."]]});
A("m9","frango-ensopado","Frango ensopado",{min:60,ensina:["ensopar"],
  ideia:"O ensopado junta o que você já aprendeu: dourar a carne para criar sabor, refogar a base e cozinhar devagar no líquido. O dourado que fica grudado no fundo da panela é ouro: quando o tomate e a água entram, ele se solta e vira o gosto do caldo. Frango com osso deixa o caldo mais encorpado e avisa quando está pronto: a carne quase se solta do osso.",
  observar:["Doure o frango em duas levas, se precisar: panela cheia não doura.","O fundo marrom da panela solta com o líquido. Raspe com a colher.","A água chega só até a metade da altura do frango. Não é sopa.","Pronto: a carne quase solta do osso, a batata está macia e o caldo cobre a colher."],

    P("Aqueça o óleo e doure o frango, sem encher a panela. Passe para o prato.",3,360,"dourado dos dois lados; não precisa estar cozido"),
    P("Na mesma panela, refogue a cebola, depois o alho.",2,150,"cebola macia"),
    P("Junte o tomate, o pimentão e o colorau e raspe o fundo da panela com a colher.",2,180,"o tomate desmanchou e o fundo soltou"),
    P("Volte o frango, junte as batatas, a água quente e o resto do sal.",3,null,"ferveu; a água chega à metade do frango"),
    P("Baixe o fogo e tampe.",1,1800,"a carne quase solta do osso, a batata está macia, sem nenhum rosado no frango"),
    P("Se o caldo estiver ralo, destampe e ferva mais cinco minutos. Prove o sal e junte o coentro.")],
  erros:[["O caldo ficou ralo.","Água demais. Destampe e deixe reduzir; amassar um pedaço de batata no caldo também engrossa."],
    ["O frango ficou pálido e sem gosto.","Faltou dourar. Frango seco, panela quente e poucas peças por vez."],

A("m9","strogonoff","Strogonoff de frango",{min:40,ensina:["engrossar"],

  observar:["Cubos de frango do mesmo tamanho, dourados em duas levas.","Antes do creme, o molho está grosso e com gosto forte: o creme vai suavizar.","O creme entra e o molho fica rosado e liso. Uma bolha de fervura e é hora de desligar.","Nenhum cubo rosado por dentro: corte um para conferir."],
  ing:[I(500,"g","peito de frango em cubos"),I(1,"","cebola picada"),I(2,"dente","alho picado"),I(2,"c. sopa","ketchup"),I(1,"c. sopa","mostarda"),I(200,"g","creme de leite","uma caixinha"),I(1,"c. sopa","óleo"),I(1,"c. sopa","manteiga"),I(1,"c. chá","sal"),I(100,"g","champignon fatiado","opcional")],
  ut:["Frigideira funda ou panela larga","Colher de pau","Prato"],
  passos:[P("Seque os cubos de frango e tempere com o sal."),
    P("Aqueça o óleo e doure metade do frango. Passe para o prato e doure a outra metade.",3,300,"cubos dourados por fora"),
    P("Baixe o fogo, derreta a manteiga e refogue a cebola, depois o alho.",2,150,"cebola macia"),
    P("Volte o frango, junte o ketchup, a mostarda, o champignon e meia xícara de água. Raspe o fundo.",2),
    P("Cozinhe até o molho encorpar.",1,480,"molho grosso; um cubo cortado está branco por inteiro"),
    P("Ponha o fogo no mínimo, junte o creme de leite e misture só até aquecer. Não deixe ferver.",1,60,"molho rosado e liso"),
    P("Prove o sal e sirva com arroz branco e batata palha.")],
  erros:[["O molho talhou.","O creme ferveu. Fogo no mínimo e desligar na primeira bolha."],
    ["O frango ficou borrachudo.","Cozinhou demais antes do molho. Dourar é rápido: ele termina no molho."],

A("m10","provar-e-corrigir","Provar e corrigir",{prato:"Macarrão do que tem em casa",min:35,ensina:["corrigir"],
  ideia:"Cozinhar sem receita é saber fazer quatro perguntas enquanto prova. Está sem graça? Falta sal. Está pesado ou enjoativo? Falta ácido: limão ou vinagre. Está seco ou áspero? Falta gordura: azeite ou manteiga. Está certo, mas sem vida? Faltam ervas, pimenta ou algo fresco. Nesta aula não há quantidade exata: você monta um macarrão com o que tiver e corrige até ficar bom.",
  observar:["Prove em três momentos: o refogado, o molho antes da massa e o prato pronto.","Corrija uma coisa de cada vez e prove de novo.","Sal se põe aos poucos. Passou do ponto, só dá para diluir: mais massa, mais legume, um pouco de água.","Umas gotas de limão no final acordam quase qualquer prato."],
  ing:[I(300,"g","macarrão curto"),I(1,"","cebola picada"),I(2,"dente","alho picado"),I(2,"xíc","legumes que tiver, picados","abobrinha, tomate, cenoura, brócolis, milho"),I(3,"c. sopa","azeite"),I(1,"","limão"),I(null,"","sal"),I(null,"","queijo ralado, ervas ou pimenta","o que tiver")],
  ut:["Panela grande","Frigideira grande","Escorredor","Xícara","Colher para provar"],

    P("Refogue a cebola e o alho no azeite. Junte os legumes mais duros primeiro, depois os macios, com uma pitada de sal.",2,null,"legumes macios, ainda com cor"),
    P("Prove um legume. Sem graça? Mais uma pitada de sal."),
    P("Cozinhe a massa na água fervente e salgada, um minuto a menos que a embalagem. Reserve uma xícara da água.",3,540,"macia com leve resistência"),
    P("Junte a massa aos legumes com um pouco da água reservada e mexa.",2,60,"molho brilhante envolvendo a massa"),
    P("Prove e faça as quatro perguntas: falta sal? falta ácido? falta gordura? falta vida? Corrija uma coisa de cada vez e prove de novo."),
    P("Sirva quando você comeria o prato inteiro com gosto.")],
  erros:[["Salgou demais.","Não dá para tirar sal. Dilua com mais massa ou legume sem sal e um pouco de água. Limão disfarça um pouco."],
    ["Ficou sem graça mesmo com sal.","Falta ácido ou algo fresco. Limão, queijo ralado, ervas."],
    ["Não sei o que falta.","Separe uma colherada, ponha uma gota de limão e prove. Depois outra, com uma pitada de sal. A que melhorar mostra o caminho."]]});

const COLS=["progresso","receitas","favoritas","compras","conversas","config"];

function aviso(t){const el=$("#aviso");el.textContent=t;el.hidden=!t}
// Toda escrita passa por put/del: atualiza a tela primeiro, depois persiste.
async function put(col,id,dados){
  S[col]={...S[col],[id]:dados};refresh();
  if(modo==="claude"){try{await db.collection(col).doc(id).set(dados)}catch(e){toast(e&&e.code==="quota_exceeded"?"Espaço cheio: apague receitas criadas antigas.":"Não salvou na sua conta. Tente de novo.")}}
  else LS.set("local",S);
}
async function del(col,id){
  const o={...S[col]};delete o[id];S[col]=o;refresh();
  if(modo==="claude"){try{await db.collection(col).doc(id).delete()}catch{toast("Não apagou. Tente de novo.")}}
  else LS.set("local",S);
}
async function initStore(){
  const c=window.claude;
  try{db=c?await c.use("db"):null}catch{db=null}
  if(db){
    modo="claude";const pend=new Set(COLS);
    const t=setTimeout(()=>{if(pend.size)aviso("Seus dados ainda não chegaram. O que aparece pode estar desatualizado.")},10000);
    COLS.forEach(col=>db.collection(col).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[col]=o;
      if(!snap.metadata.fromCache){pend.delete(col);if(!pend.size){clearTimeout(t);aviso("")}}
      refresh();
    },()=>{clearTimeout(t);aviso("Sem conexão com seus dados. O progresso pode não ser salvo agora.")}));
  }else{
    modo="local";const L=LS.get("local",null);
    if(L)COLS.forEach(k=>{if(L[k]&&typeof L[k]==="object")S[k]=L[k]});
    aviso("");try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  }
  try{SAMPLE=c?await c.use("sample"):null}catch{SAMPLE=null}
  refresh();
}
const porc=()=>{const p=S.config.geral&&S.config.geral.porcoes;return p>=1&&p<=6?p:3};

const ORDEM=MODULOS.flatMap(m=>m.aulas);

const sabe=id=>{const e=estadoAula(id);return e==="feita"||e==="pulada"};
function proximaAula(){return ORDEM.find(id=>estadoAula(id)==="nova")||ORDEM.find(id=>estadoAula(id)==="repetir")||null}
function tecnicasSabidas(){const s=new Set();ORDEM.forEach(id=>{if(sabe(id))AULAS[id].ensina.forEach(t=>s.add(t))});return s}
function avaliar(id,nota,anotacao){
  if(LS.get("pendente",null)===id)LS.del("pendente");
  const p=S.progresso[id]||{};
  if(!AULAS[id]){put("progresso",id,{...p,estado:"feita",nota,anotacao:anotacao||"",data:hoje(),vezes:(p.vezes||0)+1});toast(nota==="bom"?"Prato feito. Bom apetite!":"Anotado. Da próxima vez, confira os sinais de pronto com calma.");return}
  const estado=nota==="bom"||p.estado==="feita"?"feita":"repetir";
  const antes=moduloFeito(AULAS[id].modulo),tecAntes=tecnicasSabidas(),livroAntes=new Set(LIVRO.filter(aberta).map(r=>r.id));
  put("progresso",id,{...p,estado,nota,anotacao:anotacao||"",data:hoje(),vezes:(p.vezes||0)+1,diagnostico:""});
  const mod=MODULOS.find(m=>m.id===AULAS[id].modulo),fechouModulo=!antes&&moduloFeito(mod.id);
  // Concluir uma aula pela primeira vez merece uma tela própria; repetir só confirma.
  if(estado==="feita"&&p.estado!=="feita"){
    const tec=[...tecnicasSabidas()].filter(t=>!tecAntes.has(t)).map(t=>TECNICAS[t].nome);
    const abriu=LIVRO.filter(r=>aberta(r)&&!livroAntes.has(r.id));
    setTimeout(()=>telaConcluida(id,tec,abriu,fechouModulo?mod:null),60);
    return;
  }
  if(fechouModulo)toast(`Módulo concluído: ${mod.titulo}.`,{acao:{rotulo:SAMPLE?"Criar receita nova":"O que dá pra fazer",fn:()=>AC["nova-receita"]()}});
  else toast(nota==="bom"?"Aula concluída.":"Anotado. A aula fica na lista para repetir.");
}
const listaE=xs=>xs.length<2?(xs[0]||""):xs.slice(0,-1).join(", ")+" e "+xs[xs.length-1];
function telaConcluida(id,tec,abriu,mod){
  const a=AULAS[id],prox=proximaAula(),primeira=ORDEM.filter(sabe).length===1,lista=listaE;
  openDlg(primeira?"Seu primeiro prato":"Prato feito",`<p class="prosa">Você fez <b>${esc(a.receita.titulo||a.titulo)}</b>${primeira?" sozinho, do começo ao fim":""}.</p>

      ${tec.length?`<li><span>${tec.length>1?"Técnicas novas":"Técnica nova"}</span><b>${esc(lista(tec))}</b></li>`:""}
      ${mod?`<li><span>Módulo concluído</span><b>${esc(mod.titulo)}</b></li>`:""}
      ${abriu.length?`<li><span>Abriu no livro</span><b>${abriu.slice(0,3).map(r=>esc(r.titulo)).join(", ")}${abriu.length>3?` e mais ${abriu.length-3}`:""}</b></li>`:""}
      ${prox?`<li><span>Próxima aula</span><b>${esc(AULAS[prox].titulo)}</b></li>`:""}
    </ul>`,prox?()=>{go("aula",prox)}:null,prox?"Abrir a próxima aula":null,{nao:"Fechar"});
}
function pular(id){const p=S.progresso[id]||{};put("progresso",id,{...p,estado:"pulada",data:hoje()});toast("Aula marcada como já sabida.",{undo:()=>p.estado?put("progresso",id,p):del("progresso",id)})}
function moduloFeito(mid){const m=MODULOS.find(x=>x.id===mid);return m.aulas.length>0&&m.aulas.every(sabe)}
function aulaQueEnsina(t){return ORDEM.find(id=>AULAS[id].ensina.includes(t))||null}
function aberta(r){if(!r.exige||S.receitas[r.id])return true;const s=tecnicasSabidas();return r.exige.every(t=>s.has(t))}

function receitaDe(id){return (AULAS[id]&&AULAS[id].receita)||LIVRO.find(r=>r.id===id)||S.receitas[id]||null}
