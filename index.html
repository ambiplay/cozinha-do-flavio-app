// ---------- Compras ----------
const chave=(item,u)=>item.trim().toLowerCase()+"|"+(u||"");
// No mercado se compra a cebola, não a cebola picada: o preparo sai do nome.
const PREPARO=/\s+(bem\s+)?(picad|ralad|fatiad|cortad|amassad|esmagad|batid|derretid|peneirad|espremid|lavad|descascad|em cubos|em rodelas|em tiras|em pedaços|em fatias|em gomos|sem pele|sem semente)[\s\S]*$/i;
const nomeCompra=item=>{const n=item.replace(PREPARO,"").trim();return n||item};
// "2 cebolas", "3 limões": coisa contada acima de um vai para o plural na primeira palavra.
const plural=(item,q,u)=>u||q==null||q<=1?item:item.replace(/^(\S+)/,w=>/s$/i.test(w)?w:/ão$/i.test(w)?w.slice(0,-2)+"ões":/[aeiou]$/i.test(w)?w+"s":/[rz]$/i.test(w)?w+"es":w);
function paraCompras(r,p){
  const base=r.porcoes||3;let n=0;const lista={...S.compras},fora=[];
  r.ingredientes.forEach(i=>{
    // Água, sal e óleo são da despensa: não entram na lista.
    const b=i.item.match(/^(água|sal|óleo)(?=\s|$)/i);
    if(b){const k=b[1].toLowerCase();if(!fora.includes(k))fora.push(k);return}
    // Sem unidade é coisa contada (cebola, ovo): meia cebola na receita é uma cebola no mercado.
    let q=i.q==null?null:i.q*p/base;if(q!=null&&!i.u)q=Math.ceil(q-0.001);i={...i,item:nomeCompra(i.item)};
    const ja=Object.entries(lista).find(([,c])=>!c.feito&&chave(c.item,c.u)===chave(i.item,i.u));
    if(ja){const c=ja[1];const novo={...c,q:c.q!=null&&q!=null?c.q+q:c.q??q,origem:c.origem&&c.origem!==r.titulo?"várias receitas":r.titulo};lista[ja[0]]=novo;put("compras",ja[0],novo)}
    else{const id=uid()+n;const novo={item:i.item,q,u:i.u||"",feito:false,origem:r.titulo,ordem:Date.now()+n};lista[id]=novo;put("compras",id,novo)}
    n++;
  });
  const e=a=>a.length<2?a[0]:a.slice(0,-1).join(", ")+" e "+a[a.length-1];
  const nota=fora.length?` ${e(fora).replace(/^./,c=>c.toUpperCase())} ${fora.length>1?"ficaram":"ficou"} de fora.`:"";
  toast(`${n} ${n===1?"item":"itens"} na lista de compras.${nota}`,{acao:{rotulo:"Ver lista",fn:()=>go("compras")}});
}

function bip(){
  try{if(!audio)return;const t0=audio.currentTime;[0,.35,.7].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.3,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.28);o.connect(g).connect(audio.destination);o.start(t0+d);o.stop(t0+d+.3)})}catch{}
  try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch{}
}
function ligaSom(){try{if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==="suspended")audio.resume()}catch{}}
const relogio=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
// Nome curto de um passo, para identificar o timer: o começo da frase, cortado na primeira pausa.
function resumoPasso(txt){const t=String(txt).split(/[.,;:]/)[0].trim();return t.length<=34?t:t.slice(0,32).replace(/\s+\S*$/,"")+"…"}
// Os timers guardam o instante de término; o tique só lê o relógio, então aba em segundo plano não atrasa.
function tique(){
  if(!CZ||!CZ.timers||!CZ.timers.length)return;
  const agora=Date.now(),r=receitaDe(CZ.id);let mudou=false;
  // No modo cozinhar o aviso vermelho no topo já diz tudo; o toast só aparece fora dele.
  CZ.timers.forEach(t=>{if(!t.tocou&&agora>=t.fim){t.tocou=true;mudou=true;bip();const s=r&&r.passos[t.passo-1];
    if(cur!=="cozinhar")toast(`Acabou o tempo do passo ${t.passo}${r?` de ${r.titulo}`:""}.${s&&s.pronto?` Confira: ${s.pronto}.`:""}`,{ms:12000,acao:{rotulo:"Ver",fn:()=>go("cozinhar")}})}});
  // Um diálogo aberto no fogão cobriria o aviso: o tempo que acabou fala mais alto.
  if(mudou){salvaCZ();if(cur==="cozinhar"){const d=$("#dlg");if(d.open)d.close();V.cozinhar.update()}else if(cur==="inicio")refresh()}
  $$("[data-tfim]").forEach(el=>{el.textContent=relogio(+el.dataset.tfim-agora)});
}
setInterval(tique,500);

// Começar outra receita no meio de uma pergunta antes: trocar apaga o passo e os timers da atual.
AC.cozinhar=d=>{
  const nova=receitaDe(d.id);if(!nova)return;
  ligaSom();
  const velha=CZ&&CZ.id!==d.id&&receitaDe(CZ.id);
  const comecar=()=>{CZ={id:d.id,passo:0,porcoes:porc(),ok:{},timers:[]};salvaCZ();go("cozinhar")};
  if(velha&&(CZ.passo>0||CZ.timers.length)){
    const correndo=CZ.timers.filter(t=>!t.tocou).length;
    openDlg("Trocar de receita?",`<p>Você está no meio de <b>${esc(velha.titulo)}</b>${CZ.passo?`, no passo ${CZ.passo} de ${velha.passos.length}`:""}${correndo?`, com ${correndo>1?correndo+" timers correndo":"um timer correndo"}`:""}.</p><p>Se começar <b>${esc(nova.titulo)}</b>, esse progresso${CZ.timers.length?" e os timers":""} se perdem.</p>`,()=>{comecar()},"Trocar de receita",{calmo:true,nao:"Manter "+velha.titulo});
    return;
  }
  if(!CZ||CZ.id!==d.id)return comecar();
  salvaCZ();go("cozinhar");
};
AC["cz-sair"]=()=>{const id=CZ&&CZ.id;if(id&&AULAS[id])go("aula",id);else if(id)go("receita",id);else go("inicio")};
function irPasso(k){
  const r=CZ&&receitaDe(CZ.id);if(!r)return;
  k=Math.max(0,Math.min(r.passos.length,k));if(k===CZ.passo)return;
  CZ.passo=k;CZ.conf=null;salvaCZ();V.cozinhar.update();window.scrollTo(0,0);
}
const ultimoPasso=()=>{const r=CZ&&receitaDe(CZ.id);return !r||CZ.passo>=r.passos.length};
AC["cz-ant"]=()=>{if(CZ)irPasso(CZ.passo-1)};
AC["cz-prox"]=()=>{if(CZ){ligaSom();irPasso(CZ.passo+1)}};
AC["cz-ir"]=d=>irPasso(+d.p);
// Ao terminar, o prato fica "pendente" até ele dizer como ficou, mesmo se fechar o diálogo.
AC["cz-fim"]=()=>{
  const id=CZ&&CZ.id;if(!id)return;
  CZ=null;salvaCZ();LS.set("pendente",id);
  go(AULAS[id]?"aula":"receita",id);dlgAvaliar(id);
};
// Reiniciar um timer que está correndo pede um segundo toque em até 4 segundos.
AC["cz-timer"]=()=>{
  const r=CZ&&receitaDe(CZ.id);if(!r)return;const s=r.passos[CZ.passo-1];if(!s||!s.timer)return;
  ligaSom();
  const meu=CZ.timers.find(t=>t.passo===CZ.passo&&!t.tocou);
  if(meu&&!(CZ.conf&&CZ.conf.passo===CZ.passo&&Date.now()-CZ.conf.em<4000)){
    CZ.conf={passo:CZ.passo,em:Date.now()};V.cozinhar.update();
    setTimeout(()=>{if(CZ&&CZ.conf&&Date.now()-CZ.conf.em>=4000){CZ.conf=null;if(cur==="cozinhar")V.cozinhar.update()}},4100);
    return;
  }
  CZ.conf=null;
  CZ.timers=CZ.timers.filter(t=>t.passo!==CZ.passo);
  CZ.timers.push({passo:CZ.passo,nome:resumoPasso(s.txt),fim:Date.now()+s.timer*1000,tocou:false});
  CZ.timers.sort((a,b)=>a.fim-b.fim);
  salvaCZ();V.cozinhar.update();
};
// O sinal ainda não apareceu: mais um pouco no mesmo timer, sem recomeçar do zero.
AC["timer-mais"]=d=>{
  if(!CZ)return;const t=CZ.timers[+d.i];if(!t)return;ligaSom();
  t.fim=Date.now()+(+d.m)*60000;t.tocou=false;CZ.timers.sort((a,b)=>a.fim-b.fim);salvaCZ();V.cozinhar.update();
};
AC["timer-x"]=d=>{
  if(!CZ)return;const i=+d.i,t=CZ.timers[i];if(!t)return;
  CZ.timers.splice(i,1);salvaCZ();V.cozinhar.update();
  if(!t.tocou)toast(`Timer do passo ${t.passo} cancelado.`,{undo:()=>{if(!CZ)return;CZ.timers.push(t);CZ.timers.sort((a,b)=>a.fim-b.fim);salvaCZ();if(cur==="cozinhar")V.cozinhar.update()}});
};
AC["cz-ing"]=()=>{const r=CZ&&receitaDe(CZ.id);if(!r)return;openDlg("Ingredientes",`<ul class="ing">${r.ingredientes.map(i=>`<li>${ingHTML(i,CZ.porcoes,r.porcoes||3)}</li>`).join("")}</ul>`,null)};
// Ajuda no fogão: o que pode dar errado nesta receita, sem sair do modo cozinhar.
function errosDa(r){
  if(AULAS[r.id])return{erros:AULAS[r.id].erros,obs:AULAS[r.id].observar};
  const aulas=ORDEM.filter(id=>AULAS[id].ensina.some(t=>(r.exige||[]).includes(t)));
  return{erros:aulas.flatMap(id=>AULAS[id].erros).slice(0,8),obs:[]};
}
// Os problemas que dividem palavras com o passo atual vêm primeiro: no passo de refogar, "o alho amargou" sobe.
const semAcento=t=>String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const raizes=t=>new Set(semAcento(t).split(/[^a-z]+/).filter(w=>w.length>=4).map(w=>w.slice(0,5)));
function ordenaPorPasso(erros,s){
  const p=raizes(s.txt+" "+(s.pronto||""));
  const nota=x=>[...raizes(x.problema+" "+x.conserto)].filter(w=>p.has(w)).length;
  return erros.map((x,i)=>({x,i,n:nota(x)})).sort((a,b)=>b.n-a.n||a.i-b.i).map(o=>o.x);
}
// Só as regras de segurança que valem para esta receita.
function pontoSeguro(r){
  const t=semAcento(r.ingredientes.map(i=>i.item).join(" ")+" "+(r.utensilios||[]).join(" ")+" "+r.passos.map(s=>s.txt).join(" "));
  const out=[];
  if(/frango|carne|peito|coxa|file|bife|patinho|acem|musculo/.test(t))out.push("Frango e carne: nenhuma parte rosada por dentro. Na dúvida, corte o pedaço mais grosso e olhe.");
  if(/pressao/.test(t))out.push("Panela de pressão: só abra quando o pino baixar sozinho e não sair mais vapor.");
  if(/oleo|azeite|fritar|frite/.test(t))out.push("Óleo pegando fogo: desligue o fogo e tampe a panela. Nunca jogue água.");
  if(/forno|refratario|assadeira|forma/.test(t))out.push("Forno: use luva para tirar e apoie a forma quente numa tábua, nunca direto na pia.");
  if(/faca|pique|picad|corte|fatie/.test(t))out.push("Faca: dobre a ponta dos dedos da mão que segura o alimento e corte devagar.");
  if(r.passos.some(s=>s.fogo)&&out.length<3)out.push("Antes de sair de perto do fogão, desligue o fogo.");
  if(!out.length)out.push("Lave as mãos antes de começar e depois de mexer em ovo cru.");
  return out;
}
AC["cz-ajuda"]=()=>{
  const r=CZ&&receitaDe(CZ.id);if(!r)return;
  const{erros:todos,obs}=errosDa(r),s=CZ.passo?r.passos[CZ.passo-1]:null;
  const erros=s?ordenaPorPasso(todos,s):todos,seg=pontoSeguro(r);
  openDlg("Deu problema?",`${s&&s.pronto?`<div class="cz-pronto"><span class="sobre">Este passo está pronto quando</span>${esc(s.pronto)}</div>`:""}
    ${erros.length?`<section class="ajuda-sec"><h3>O que aconteceu?</h3><div class="sintomas">${erros.map(x=>`<details><summary>${esc(x.problema)}</summary><p>${esc(x.conserto)}</p></details>`).join("")}</div></section>`:""}
    ${obs.length?`<section class="ajuda-sec"><div class="sintomas"><details><summary>O que observar nesta aula</summary><ul>${obs.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></details></div></section>`:""}
    <section class="ajuda-sec"><h3>Ponto seguro</h3><ul>${seg.map(x=>`<li>${x}</li>`).join("")}</ul></section>
    <div><button class="btn soft" type="button" data-ac="duvida" data-id="${esc(r.id)}">${SAMPLE?"Perguntar ao Claude":"Fazer uma pergunta"}</button></div>`,null);
};
document.addEventListener("change",e=>{const i=e.target.dataset&&e.target.dataset.czok;if(i!=null&&CZ){CZ.ok=CZ.ok||{};CZ.ok[i]=e.target.checked;salvaCZ()}});
// Teclado: setas trocam de passo no modo cozinhar e de aba em qualquer lista de abas.
document.addEventListener("keydown",e=>{
  const tab=e.target.closest&&e.target.closest('[role="tab"]');
  if(tab&&["ArrowRight","ArrowLeft","Home","End"].includes(e.key)){
    e.preventDefault();const ts=$$('[role="tab"]',tab.parentElement);let i=ts.indexOf(tab);
    i=e.key==="Home"?0:e.key==="End"?ts.length-1:(i+(e.key==="ArrowRight"?1:-1)+ts.length)%ts.length;
    const id=ts[i].id;ts[i].click();setTimeout(()=>{const n=document.getElementById(id);if(n)n.focus()});return;
  }
  if(cur!=="cozinhar"||$("#dlg").open||(e.target.closest&&e.target.closest("input,textarea,select,button")))return;
  if(e.key==="ArrowRight"&&!ultimoPasso()){e.preventDefault();AC["cz-prox"]()}
  else if(e.key==="ArrowLeft"){e.preventDefault();AC["cz-ant"]()}
});
// Deslizar o dedo sobre o passo troca de passo; nunca termina a receita por engano.
let toque=null;
document.addEventListener("touchstart",e=>{toque=cur==="cozinhar"&&e.touches.length===1&&e.target.closest("#cz-corpo")?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
document.addEventListener("touchend",e=>{
  if(!toque)return;const t=e.changedTouches[0],dx=t.clientX-toque.x,dy=t.clientY-toque.y;toque=null;
  if(Math.abs(dx)<70||Math.abs(dy)>50)return;
  if(dx<0){if(!ultimoPasso())AC["cz-prox"]()}else AC["cz-ant"]();
},{passive:true});

V.cozinhar={
  mount(el){
    el.innerHTML=`<header class="cz-topo"><button class="iconbtn" data-ac="cz-sair" aria-label="Sair do modo cozinhar">✕</button>
        <div class="cz-tit"><b id="cz-nome"></b><span id="cz-prog"></span></div></header>
      <div class="cz-timers" id="cz-timers"></div><main class="cz-corpo" id="cz-corpo"></main>
      <footer class="cz-pe" id="cz-pe"><div class="cz-ferr"><button class="btn soft" data-ac="cz-ing">Ingredientes</button><button class="btn soft" data-ac="cz-ajuda">Deu problema?</button></div>
        <div class="cz-nav"><button class="btn soft grande" data-ac="cz-ant" id="cz-ant">Anterior</button><button class="btn acao grande" data-ac="cz-prox" id="cz-prox">Próximo</button></div></footer>`;
    acordar();
  },
  update(){
    const box=$("#cz-corpo");if(!box)return;
    const r=CZ&&receitaDe(CZ.id);
    if(!r){box.innerHTML=`<p class="vazio">${CZ&&modo==="carregando"?"Carregando a receita…":"Nenhuma receita em andamento."} <button class="linkbtn" data-ac="go" data-v="inicio">Voltar ao início</button></p>`;$("#cz-pe").hidden=true;$("#cz-timers").innerHTML="";return}
    $("#cz-pe").hidden=false;
    const n=r.passos.length,k=CZ.passo,agora=Date.now();
    $("#cz-nome").textContent=r.titulo;$("#cz-prog").textContent=k?`Passo ${k} de ${n}`:"Antes de começar";
    // A pílula só mostra o tempo; cancelar é o × dela, com desfazer.
    $("#cz-timers").innerHTML=CZ.timers.map((t,i)=>{const nome=t.nome||t.rotulo||"";
      if(t.tocou){const s=r.passos[t.passo-1];
        // Depois que ele já passou daquele passo, o aviso encolhe para uma linha e o passo atual volta a mandar.
        if(t.passo<k)return `<div class="relogio fim curto" role="status"><span class="nome"><b>Passo ${t.passo}: acabou</b></span><button type="button" class="relogio-ir" data-ac="cz-ir" data-p="${t.passo}">Ver o passo</button><button type="button" class="relogio-x" data-ac="timer-x" data-i="${i}" aria-label="Dispensar o aviso do passo ${t.passo}">×</button></div>`;
        return `<div class="relogio fim" role="status"><span class="nome"><b>Passo ${t.passo}: acabou o tempo</b><span>${esc(s&&s.pronto?"Confira: "+s.pronto:nome)}</span></span>${t.passo!==k?`<button type="button" class="relogio-ir" data-ac="cz-ir" data-p="${t.passo}">Ver o passo</button>`:""}<button type="button" class="relogio-x" data-ac="timer-x" data-i="${i}" aria-label="Dispensar o aviso do passo ${t.passo}">×</button>
          <div class="relogio-mais"><span>Ainda não?</span><button type="button" class="relogio-ir" data-ac="timer-mais" data-i="${i}" data-m="1" aria-label="Mais 1 minuto no passo ${t.passo}">+1 min</button><button type="button" class="relogio-ir" data-ac="timer-mais" data-i="${i}" data-m="3" aria-label="Mais 3 minutos no passo ${t.passo}">+3 min</button></div></div>`}
      // O passo que está na tela não precisa do próprio resumo; os outros, sim.
      return `<div class="relogio"><span class="nome"><b>${t.passo===k?"Este passo":"Passo "+t.passo}</b>${t.passo===k?"":`<span>${esc(nome)}</span>`}</span><b class="tempo" role="timer" data-tfim="${t.fim}">${relogio(t.fim-agora)}</b><button type="button" class="relogio-x" data-ac="timer-x" data-i="${i}" aria-label="Cancelar o timer do passo ${t.passo}: ${esc(nome)}">×</button></div>`}).join("");
    const ant=$("#cz-ant"),prox=$("#cz-prox");ant.disabled=k===0;
    if(k===0){
      box.innerHTML=`<h1 class="h-pag">Separe tudo antes de acender o fogo</h1><p class="nota">Para ${CZ.porcoes} ${CZ.porcoes>1?"porções":"porção"}. Leia os ${n} passos uma vez e marque o que já está na bancada. Para trocar de passo, toque em Próximo ou deslize o dedo para o lado.</p>
        <ul class="cz-lista">${r.ingredientes.map((i,x)=>`<li><label><input type="checkbox" id="czi-${x}" data-czok="i${x}"${CZ.ok&&CZ.ok["i"+x]?" checked":""}><span>${ingHTML(i,CZ.porcoes,r.porcoes||3)}</span></label></li>`).join("")}
        ${(r.utensilios||[]).map((u,x)=>`<li><label><input type="checkbox" id="czu-${x}" data-czok="u${x}"${CZ.ok&&CZ.ok["u"+x]?" checked":""}><span>${esc(u)}</span></label></li>`).join("")}</ul>
        <ol class="passos">${r.passos.map(s=>`<li><span>${esc(s.txt)}</span></li>`).join("")}</ol>`;
      prox.textContent="Começar";prox.dataset.ac="cz-prox";return;
    }
    const s=r.passos[k-1],meu=CZ.timers.find(t=>t.passo===k&&!t.tocou),acabou=CZ.timers.some(t=>t.passo===k&&t.tocou);
    const conf=meu&&CZ.conf&&CZ.conf.passo===k&&agora-CZ.conf.em<4000;
    box.innerHTML=`${s.fogo?`<div>${fogoHTML(s.fogo,true)}</div>`:""}
      <p class="cz-passo">${esc(s.txt)}</p>
      ${s.pronto?`<div class="cz-pronto${acabou?" agora":""}"><span class="sobre">Pronto quando</span>${esc(s.pronto)}</div>`:""}
      ${s.timer?`<div><button class="btn contorno grande" style="flex:none" data-ac="cz-timer">${meu?(conf?"Toque de novo para reiniciar":"Timer correndo"):`Iniciar timer de ${fmtTempo(s.timer)}`}</button></div>`:""}`;
    if(k===n){prox.textContent="Terminei";prox.dataset.ac="cz-fim"}else{prox.textContent="Próximo";prox.dataset.ac="cz-prox"}
  }
};

// ---------- Claude dentro do app ----------
const REGRAS=`Você é o professor de cozinha de um curso para um único aluno, o Flavio, que mora em Natal (RN) e está aprendendo a cozinhar do zero. Regras fixas:
- Responda em português do Brasil, simples e direto, sem markdown.
- O Flavio não come carne de porco nem derivados (bacon, linguiça de porco, presunto, calabresa, banha, toucinho). Nunca sugira esses ingredientes.
- Segurança alimentar conservadora: frango e carne moída sempre totalmente cozidos; panela de pressão só se abre depois que o pino baixa sozinho; nada de improvisar com óleo quente.
- Use só técnicas que ele já concluiu. Equipamento da casa: fogão, forno, airfryer, micro-ondas, panelas comuns e panela de pressão.`;
const FORMATO=`Responda só com um objeto JSON, neste formato:
{"titulo":string,"minutos":number,"exige":[ids de técnicas da lista acima],"ingredientes":[{"q":number ou null,"u":"xíc"|"c. sopa"|"c. chá"|"g"|"ml"|"dente"|"","item":string,"obs":string opcional}],"utensilios":[string],"passos":[{"txt":string,"fogo":null|1|2|3,"timer":segundos ou null,"pronto":string opcional}]}
Quantidades para 3 pessoas. "q" é null para "a gosto". "fogo": 1 baixo, 2 médio, 3 alto, null quando o passo não vai ao fogo. Cada passo é uma ação só; em "pronto" diga o sinal de olho, ouvido ou nariz que mostra que o passo terminou. Entre 4 e 12 passos.`;
function msgErro(e){const c=e&&e.code;return c==="cancelled"?"":c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled"?"O Claude não está liberado nesta página.":c==="rate_limited"?"Muitos pedidos agora. Espere um pouco e tente de novo.":c==="session_expired"?"Entre de novo na sua conta para usar o Claude.":c==="refused"?"O Claude não respondeu a esse pedido. Tente pedir de outro jeito.":"O Claude não respondeu. Tente de novo."}
function ctxReceita(r){return `${r.titulo} (${r.porcoes||3} porções)\nIngredientes: ${r.ingredientes.map(i=>[i.q==null?"":i.q,un(i.u,i.q),i.item].filter(Boolean).join(" ")).join("; ")}\nPassos:\n${r.passos.map((s,i)=>`${i+1}. ${s.txt}${s.fogo?` [${FOGO[s.fogo]}]`:""}${s.pronto?` (pronto quando: ${s.pronto})`:""}`).join("\n")}`}
function listaTecnicas(){const s=tecnicasSabidas();return [...s].map(t=>`${t}: ${TECNICAS[t].nome}`).join("\n")||"(nenhuma ainda: só montar, misturar e esquentar)"}

/*VALIDAR-INI*/
const PORCO=/\bporcos?\b|su[ií]n[oa]|bacon|presunto|calabresa|\bbanha\b|lingui[cç]a|toucinho|torresmo|pernil|\blombo\b|salame|mortadela|salsicha|pancet+a|costelinha/i;
// Aceita uma receita vinda do Claude só se estiver completa, dentro das técnicas concluídas e sem porco.
function validarReceita(o,sab=tecnicasSabidas()){
  if(!o||typeof o!=="object"||Array.isArray(o))return null;
  const s=(v,n)=>String(v??"").trim().slice(0,n);
  const titulo=s(o.titulo,80);if(!titulo)return null;
  const exige=Array.isArray(o.exige)?o.exige.map(String):[];
  if(exige.some(t=>!TECNICAS[t]||!sab.has(t)))return null;
  const ingredientes=(Array.isArray(o.ingredientes)?o.ingredientes:[]).map(i=>i&&typeof i==="object"?{q:typeof i.q==="number"&&i.q>0&&isFinite(i.q)?i.q:null,u:s(i.u,16),item:s(i.item,80),...(i.obs?{obs:s(i.obs,80)}:{})}:null).filter(i=>i&&i.item).slice(0,30);
  const passos=[];
  for(const p of Array.isArray(o.passos)?o.passos:[]){
    if(!p||typeof p!=="object")continue;
    const fogo=p.fogo==null?null:p.fogo;if(![null,1,2,3].includes(fogo))return null;
    const txt=s(p.txt,600);if(!txt)continue;
    const timer=typeof p.timer==="number"&&isFinite(p.timer)&&p.timer>0?Math.min(Math.round(p.timer),14400):null;
    passos.push({txt,fogo,timer,...(p.pronto?{pronto:s(p.pronto,200)}:{})});
  }

  if(PORCO.test(JSON.stringify([r.titulo,r.ingredientes,r.passos,r.utensilios])))return null;

}

// Receitas que o usuário digita (vistas em vídeos e sites): lê as caixas do formulário.
const RP_MARCA=/^\s*(?:[-•*–]|\d+[.)])\s+/;
const RP_FRAC={"½":.5,"¼":.25,"¾":.75};
const RP_FIM="(?=[\\s(]|$)";
const RP_UNID=[
  [new RegExp("^(?:kg|quilos?|quilogramas?)"+RP_FIM,"i"),"g",1000],
  [new RegExp("^(?:gramas?|gr|g)"+RP_FIM,"i"),"g",1],
  [new RegExp("^(?:ml|mililitros?)"+RP_FIM,"i"),"ml",1],
  [new RegExp("^(?:litros?|l)"+RP_FIM,"i"),"ml",1000],
  [/^colher(?:es)?\s*(?:\(sopa\)|de\s+sopa)/i,"c. sopa",1],
  [/^colher(?:es)?\s*(?:\(ch[aá]\)|de\s+ch[aá])/i,"c. chá",1],
  [/^x[ií]c(?:aras?|\.)?(?:\s*\(ch[aá]\)|\s+de\s+ch[aá](?=\s+de\s))?/i,"xíc",1],
  [new RegExp("^dentes?"+RP_FIM,"i"),"dente",1],
];
const RP_SO_MARCA=/^(?:[-•*–]|\d+[.)]?)$/;
function rpLinhas(t){return String(t??"").split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!RP_SO_MARCA.test(l)).map(l=>l.replace(RP_MARCA,"").trim()).filter(Boolean)}
function lerIngrediente(linha){
  const l=String(linha??"").replace(RP_MARCA,"").trim().slice(0,120);if(!l)return null;
  // misto "1 1/2" ou "1 e 1/2" | "1½" | "1/2" | milhar "1.000" | "0,5" | "½"
  const m=l.match(/^(?:(\d+)\s+(?:e\s+)?(\d+)\/(\d+)|(\d+)\s*([½¼¾])|(\d+)\/(\d+)|(\d{1,3}(?:\.\d{3})+)(?![\d,])|(\d+(?:[.,]\d+)?)|([½¼¾]))\s*/);
  if(!m)return {q:null,u:"",item:l};
  let q=m[1]?+m[1]+m[2]/m[3]:m[4]?+m[4]+RP_FRAC[m[5]]:m[6]?m[6]/m[7]:m[8]?+m[8].replace(/\./g,""):m[9]?+m[9].replace(",","."):RP_FRAC[m[10]];
  if(!isFinite(q))return {q:null,u:"",item:l};
  let resto=l.slice(m[0].length),u="";
  // faixa "2 a 3", "1 ou 2", "2-3": fica o maior, para a lista de compras não ficar curta
  const fx=resto.match(/^(?:a|ou|-|–)\s*(\d+(?:[.,]\d+)?)(?![\d\/])\s*/i);
  if(fx){q=Math.max(q,+fx[1].replace(",","."));resto=resto.slice(fx[0].length)}
  // "3/4 de xícara": o "de" antes da unidade é opcional
  const semDe=resto.replace(/^de\s+/i,"");
  for(const [re,un,fator] of RP_UNID){const k=semDe.match(re);if(k){u=un;q=Math.round(q*fator*1000)/1000;resto=semDe.slice(k[0].length).trim();break}}
  const item=resto.replace(/^de\s+/i,"").trim();
  return item&&q>0?{q,u,item}:{q:null,u:"",item:l};
}
function lerPasso(linha){
  const txt=String(linha??"").replace(RP_MARCA,"").trim().slice(0,400);if(!txt)return null;
  let timer=0;
  // "1h30" e "1h30min" primeiro, para o "30" não ser lido sozinho
  const resto=txt.replace(/(\d+)\s*h\s*(\d{1,2})(?:\s*min(?:utos?)?)?(?=[\s.,;:!)]|$)/gi,(_,h,mi)=>{timer+=h*3600+mi*60;return " "});
  for(const m of resto.matchAll(/(\d+(?:[.,]\d+)?)\s*(horas?|h|minutos?|min|segundos?|seg|s)(?=[\s.,;:!)]|$)/gi)){
    const n=+m[1].replace(",","."),u=m[2].toLowerCase();timer+=n*(u[0]==="h"?3600:u[0]==="m"?60:1);
  }
  const f=txt.match(/fogo\s+(baixo|brando|m[eé]dio|alto)/i);
  const fogo=f?(/^(baixo|brando)$/i.test(f[1])?1:/^alto$/i.test(f[1])?3:2):null;
  // Acima de 4 horas (ex.: "de molho por 24 horas") não é timer de fogão.
  return {txt,fogo,timer:timer&&timer<=14400?Math.round(timer):null};
}
// Volta um ingrediente salvo para a linha de texto do formulário (para editar).
function rpTextoIngrediente(i){
  if(i.q==null)return i.item;
  const n=String(i.q).replace(".",","),v=i.q>1;
  const u={g:"g","ml":"ml","xíc":v?"xícaras":"xícara","c. sopa":v?"colheres de sopa":"colher de sopa","c. chá":v?"colheres de chá":"colher de chá",dente:v?"dentes":"dente"}[i.u];
  return u?`${n} ${u} de ${i.item}`:`${n} ${i.item}`;
}
function rpLink(t){
  let s=String(t??"").trim().slice(0,500);if(!s)return "";
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s))s="https://"+s;
  try{const u=new URL(s);return u.protocol==="http:"||u.protocol==="https:"?u.href:""}catch{return ""}
}
function montarReceitaPropria(c){
  // Nada é cortado sem aviso: o que passa do limite volta como erro para o usuário ajustar.
  const titulo=String(c.titulo??"").trim();
  if(!titulo)return {ok:false,erro:"Dê um nome para a receita."};
  if(titulo.length>80)return {ok:false,erro:"O nome pode ter no máximo 80 letras."};
  const li=rpLinhas(c.ingredientes),lp=rpLinhas(c.passos);
  if(!li.length)return {ok:false,erro:"Escreva pelo menos um ingrediente."};
  if(li.length>40)return {ok:false,erro:"Use no máximo 40 ingredientes."};
  if(li.some(l=>l.length>120))return {ok:false,erro:"Um ingrediente passou de 120 letras. Divida em duas linhas."};
  if(lp.length<2)return {ok:false,erro:"Escreva pelo menos dois passos, um por linha."};
  if(lp.length>30)return {ok:false,erro:"Use no máximo 30 passos."};
  if(lp.some(l=>l.length>400))return {ok:false,erro:"Um passo passou de 400 letras. Divida em dois passos."};
  const ingredientes=li.map(lerIngrediente).filter(Boolean),passos=lp.map(lerPasso).filter(Boolean);
  const porcoes=Math.min(12,Math.max(1,parseInt(c.porcoes,10)||3));
  let minutos=parseInt(c.minutos,10);
  if(!(minutos>0))minutos=Math.max(30,Math.round(passos.reduce((s,p)=>s+(p.timer||0),0)/60));
  minutos=Math.min(600,Math.max(1,minutos));
  return {ok:true,receita:{titulo,minutos,porcoes,exige:[],ingredientes,utensilios:[],passos,link:rpLink(c.link),origem:"sua"}};
}

function tirarAcento(t){return String(t??"").normalize("NFD").replace(/\p{M}/gu,"").toLowerCase()}
const SUFIXOS=["amente","ando","endo","indo","ados","adas","idos","idas","ado","ada","ido","ida","ou","ar","er","ir","am","em","os","as","es","o","a","e","s"];
function raiz(w){for(const s of SUFIXOS)if(w.endsWith(s)&&w.length-s.length>=3)return w.slice(0,w.length-s.length).slice(0,6);return w.slice(0,6)}
// Texto -> lista de raízes, sem palavras vazias, com sinônimos trocados pela forma canônica.
function normalizar(txt){
  return tirarAcento(txt).replace(/[^a-z0-9\s-]/g," ").split(/[\s-]+/).filter(w=>w&&!PARADAS.has(w))
    .flatMap(w=>(SINONIMOS[w]||w).split(" ")).map(raiz).filter(w=>w.length>=2);
}
function entrada(texto,resposta,fonte,extra){
  return {texto,resposta,fonte,palavras:[...new Set(normalizar(texto+" "+(extra||"")))],palavrasR:[...new Set(normalizar(resposta))]};
}
// Junta tudo o que o curso sabe em uma lista pesquisável.
function montarBase(TECNICAS,AULAS,LIVRO){
  const b=[];
  for(const [id,t] of Object.entries(TECNICAS))b.push(entrada(t.nome,t.def,{tipo:"tecnica",id,titulo:t.nome}));
  for(const a of Object.values(AULAS)){
    const f={tipo:"aula",id:a.id,titulo:a.titulo};
    (a.erros||[]).forEach(e=>b.push(entrada(e.problema,e.conserto,f)));
    (a.observar||[]).forEach(o=>b.push(entrada(o,o,f)));
  }
  for(const q of PERGUNTAS){
    const a=q.aula&&AULAS[q.aula];
    b.push({...entrada(q.p,q.r,a?{tipo:"aula",id:a.id,titulo:a.titulo}:{tipo:"pergunta",id:null,titulo:"Perguntas comuns"},(q.palavras||[]).join(" ")),geral:true});
  }
  return b;
}
function idfDe(base){
  if(base.__idf)return base.__idf;
  const df={};base.forEach(e=>e.palavras.concat(e.palavrasR).forEach(w=>df[w]=(df[w]||0)+1));
  const n=base.length,idf=w=>Math.log(1+n/(1+(df[w]||0)));
  Object.defineProperty(base,"__idf",{value:idf});return idf;
}
// Procura a melhor resposta. ctx: {aulaId?, passo?: {txt, pronto}}.
function buscar(pergunta,base,ctx={}){
  const q=[...new Set(normalizar(pergunta))];
  const nada={achou:false,principal:null,extras:[]};
  if(!q.length)return nada;
  const idf=idfDe(base);
  const lista=base.slice();
  if(ctx.passo&&ctx.passo.pronto)lista.push(entrada(ctx.passo.txt,`Neste passo, o ponto certo é: ${ctx.passo.pronto}.`,{tipo:"passo",id:null,titulo:"Passo atual"},ctx.passo.pronto));
  const total=q.reduce((s,w)=>s+idf(w),0);
  const pont=lista.map(e=>{
    let s=0,hits=0;
    for(const w of q){if(e.palavras.includes(w)){s+=idf(w);hits++}else if(e.palavrasR.includes(w)){s+=idf(w)*0.5;hits++}}
    if(ctx.aulaId&&e.fonte.id===ctx.aulaId)s*=1.5;
    if(e.fonte.tipo==="passo")s*=2;
    if(e.geral)s*=1.2;
    return {e,s,hits};
  }).filter(x=>x.hits>0).sort((a,b)=>b.s-a.s);
  const ok=x=>x&&x.s>=2.5&&x.s/total>=0.5;
  if(!ok(pont[0]))return nada;
  const principal=pont[0].e;
  const extras=pont.slice(1).filter(x=>ok(x)&&x.e.resposta!==principal.resposta).slice(0,2).map(x=>x.e);
  return {achou:true,principal,extras};
}

const idBase=r=>r.base||r.id;
const ARTIGO={m:{a:"o",o:"o",da:"do",do:"do",na:"no",no:"no","à":"ao",ao:"ao"},f:{a:"a",o:"a",da:"da",do:"da",na:"na",no:"na","à":"à",ao:"à"}};
// Troca o nome nos passos acertando o artigo ("a manteiga" vira "o óleo").
function trocarNoTexto(txt,t){
  const nome=t.item.replace(/^\^|\$/g,"");
  const s=txt.replace(new RegExp("(^|\\s)(a|o|da|do|na|no|à|ao)\\s+(?:"+nome+")","gi"),(_,sp,art)=>{
    const n=ARTIGO[t.g||"m"][art.toLowerCase()];
    return sp+(art[0]!==art[0].toLowerCase()?n[0].toUpperCase()+n.slice(1):n)+" "+t.curto;
  }).replace(new RegExp(nome,"gi"),t.curto);
  return s.replace(/(d)erreta o óleo/gi,(_,d)=>(d==="D"?"A":"a")+"queça o óleo");
}
function trocaServe(t,r,i){return new RegExp(t.item,"i").test(i.item)&&!(t.nao||[]).includes(idBase(r))}
// Monta a receita adaptada (ainda sem validar).
function adaptarReceita(r,esc){
  const n={...r,base:idBase(r),feito:[...(r.feito||[])],ingredientes:r.ingredientes.map(i=>({...i})),passos:r.passos.map(p=>({...p})),utensilios:[...(r.utensilios||[])],exige:[...(r.exige||[])]};
  delete n.id;
  if(esc.tipo==="troca"){
    const t=esc.troca,i=n.ingredientes[esc.indice];
    const fator=/^x([\d.]+)$/.exec(t.regra);
    n.ingredientes[esc.indice]={q:t.regra==="ver obs"?null:(fator&&i.q?Math.round(i.q*+fator[1]*100)/100:i.q),u:t.regra==="ver obs"?"":i.u,item:t.por,obs:t.obs};
    if(t.curto)n.passos=n.passos.map(p=>({...p,txt:trocarNoTexto(p.txt,t)}))
    n.titulo=`${r.titulo} (com ${t.curto||t.por.split(" (")[0]})`.slice(0,80);
  }else{
    const e=esc.equipamento;
    n.passos=e.passos?e.passos(n.passos):n.passos.map(p=>e.passo(p));
    const u=n.utensilios.findIndex(x=>e.utensilio[0].test(x));
    if(u>=0)n.utensilios[u]=e.utensilio[1];else n.utensilios.push(e.utensilio[1]);
    if(e.exige&&!n.exige.includes(e.exige))n.exige.push(e.exige);
    n.feito.push(e.id);
    n.titulo=`${r.titulo} (${e.titulo})`.slice(0,80);
  }
  return n;
}

const BASICOS=["sal","óleo","azeite","água","açúcar","alho","cebola","pimenta-do-reino"];
const CHIPS=["ovos","frango","carne moída","carne","batata","cenoura","tomate","arroz","feijão","macarrão","queijo","leite","brócolis","abobrinha","limão","pão","atum","milho"];
const chaveAj=t=>normalizar(t);
const contem=(ing,q)=>q.length&&q.every(w=>ing.includes(w));
function ehBasico(item){const n=chaveAj(item);return BASICOS.some(b=>contem(n,chaveAj(b)))}
function separarIngredientes(txt){return String(txt??"").split(/,|;|\n|\s+e\s+/i).map(s=>s.trim().toLowerCase()).filter(Boolean)}
function ingredientesComuns(receitas){
  return CHIPS.filter(c=>receitas.filter(r=>r.ingredientes.some(i=>contem(chaveAj(i.item),chaveAj(c)))).length>=2).slice(0,16);
}
function sugerir(tenho,receitas,sab){
  const qs=tenho.map(chaveAj).filter(q=>q.length);
  const agora=[],depois=[];
  if(!qs.length)return {agora,depois};
  for(const r of receitas){
    const principais=r.ingredientes.filter(i=>!ehBasico(i.item));
    if(!principais.length)continue;
    const faltam=principais.filter(i=>!qs.some(q=>contem(chaveAj(i.item),q))).map(i=>i.item);
    const cobertura=(principais.length-faltam.length)/principais.length;
    if(cobertura<0.5)continue;
    const aprender=(r.exige||[]).filter(t=>!sab.has(t));
    const s={id:r.id,titulo:r.titulo,faltam,cobertura};
    if(aprender.length){
      s.aprender=aprender;
      s.aulas=Object.values(AULAS).filter(a=>a.ensina.some(t=>aprender.includes(t))).map(a=>a.id);
      depois.push(s);
    }else agora.push(s);
  }
  const ord=(a,b)=>b.cobertura-a.cobertura||a.faltam.length-b.faltam.length;
  return {agora:agora.sort(ord),depois:depois.sort(ord)};
}

function diagnosticar(anotacao,erros){
  const q=[...new Set(normalizar(anotacao))];
  if(!q.length)return [];
  return erros.map((e,i)=>{
    const p=normalizar(e.problema),c=normalizar(e.conserto);
    return {i,s:q.reduce((s,w)=>s+(p.includes(w)?1:c.includes(w)?0.5:0),0)};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.i);
}
// Cópia do progresso: confere o arquivo antes de qualquer coisa ser substituída.
const COLS_COPIA=["progresso","receitas","favoritas","compras","conversas","config"];
function lerCopia(txt){
  const nao=motivo=>({ok:false,motivo});
  let o;try{o=JSON.parse(String(txt??""))}catch{return nao("Este arquivo não é uma cópia do Cozinha do Flavio.")}
  if(!o||typeof o!=="object"||Array.isArray(o)||o.app!=="cozinha-do-flavio")return nao("Este arquivo não é uma cópia do Cozinha do Flavio.");
  if(!o.dados||typeof o.dados!=="object"||Array.isArray(o.dados))return nao("A cópia está vazia ou incompleta.");
  const dados={};
  for(const c of COLS_COPIA){
    const v=o.dados[c];
    if(v==null){dados[c]={};continue}
    if(typeof v!=="object"||Array.isArray(v))return nao("A cópia está danificada e não foi carregada.");
    dados[c]=v;
  }
  // Receita criada sem o mínimo para a tela (título, ingredientes, dois passos) fica de fora.
  const inteira=r=>r&&typeof r==="object"&&typeof r.titulo==="string"&&Array.isArray(r.ingredientes)&&r.ingredientes.length&&Array.isArray(r.passos)&&r.passos.length>=2&&r.passos.every(p=>p&&typeof p.txt==="string");
  dados.receitas=Object.fromEntries(Object.entries(dados.receitas).filter(([,r])=>inteira(r)));
  return {ok:true,dados,exportado:typeof o.exportado==="string"?o.exportado:null};
}

    const id="g-"+uid();
    await put("receitas",id,{...r,id,criada:new Date().toISOString(),origem});
    toast(`Receita nova: ${r.titulo}.`,{acao:{rotulo:"Abrir",fn:()=>go("receita",id)}});
  }catch(e){const m=e&&e.code==="invalid_json"?"A receita veio em formato estranho. Peça de novo.":msgErro(e);if(m)toast(m)}
  finally{RC.busy=false;refresh()}
}
function receitaNova(pedido){return criarReceita(`${REGRAS}\n\nTécnicas que o Flavio já concluiu (id: nome):\n${listaTecnicas()}\n\nCrie UMA receita nova para ele, usando só essas técnicas.\nPedido dele: ${pedido||"uma receita diferente das que já fiz, no meu nível"}\n\n${FORMATO}`,"pedido seu")}
function adaptar(r,pedido){return criarReceita(`${REGRAS}\n\nTécnicas que o Flavio já concluiu (id: nome):\n${listaTecnicas()}\n\nReceita original:\n${ctxReceita(r)}\n\nAdapte esta receita conforme o pedido, mantendo o que funciona e trocando só o necessário. Em "exige" use só ids da lista.\nPedido dele: ${pedido}\n\n${FORMATO}`,"adaptada de "+r.titulo)}
// Receita própria: formulário para adicionar (sem id) ou editar (com id).
function formReceitaPropria(r){
  const v=r||{},ing=r?r.ingredientes.map(rpTextoIngrediente).join("\n"):"",pas=r?r.passos.map(x=>x.txt).join("\n"):"";
  return `<label class="campo" for="rp-titulo">Nome<input class="inp" id="rp-titulo" maxlength="80" value="${esc(v.titulo||"")}" placeholder="Ex.: Frango xadrez"></label>
    <div class="frow"><label class="campo" for="rp-min" style="flex:1">Tempo total (min)<input class="inp" id="rp-min" type="number" inputmode="numeric" min="1" max="600" value="${esc(v.minutos||"")}"></label>
      <label class="campo" for="rp-porc" style="flex:1">Rende (porções)<input class="inp" id="rp-porc" type="number" inputmode="numeric" min="1" max="12" value="${esc(v.porcoes||3)}"></label></div>
    <label class="campo" for="rp-ing">Ingredientes (um por linha)<textarea class="inp" id="rp-ing" rows="6" placeholder="500 g de peito de frango&#10;1 pimentão vermelho&#10;3 colheres de sopa de shoyu">${esc(ing)}</textarea></label>
    <label class="campo" for="rp-pas">Modo de fazer (um por linha)<textarea class="inp" id="rp-pas" rows="6" placeholder="Corte o frango em cubos.&#10;Doure em fogo médio por 8 minutos.&#10;Junte o molho e mexa.">${esc(pas)}</textarea></label>
    <label class="campo" for="rp-link">Link do vídeo ou site (opcional)<input class="inp" id="rp-link" type="url" inputmode="url" value="${esc(v.link||"")}" placeholder="youtube.com/…"></label>
    <p class="nota">Quando um passo fala em tempo, como “8 minutos”, ele ganha timer.</p>
    <p class="nota" id="rp-erro" role="alert" style="color:var(--bad)"></p>`;
}
AC["receita-propria"]=d=>{
  const velha=d&&d.id?S.receitas[d.id]:null;if(d&&d.id&&!velha)return;
  openDlg(velha?"Editar receita":"Adicionar receita",formReceitaPropria(velha),dl=>{
    const g=id=>$(id,dl).value;
    const o=montarReceitaPropria({titulo:g("#rp-titulo"),minutos:g("#rp-min"),porcoes:g("#rp-porc"),ingredientes:g("#rp-ing"),passos:g("#rp-pas"),link:g("#rp-link")});
    if(!o.ok){const e=$("#rp-erro",dl);e.textContent=o.erro;e.scrollIntoView({block:"nearest"});return false}
    const id=velha?velha.id:"m-"+uid();
    put("receitas",id,{...o.receita,id,criada:velha&&velha.criada||new Date().toISOString()});
    // Editada no meio do preparo: o passo atual e os timers não podem passar do último passo.
    if(CZ&&CZ.id===id){const n=o.receita.passos.length;CZ.passo=Math.min(CZ.passo,n);CZ.timers=CZ.timers.filter(t=>t.passo<=n);salvaCZ()}
    if(!velha){RC.aba="criadas";LS.set("aba","criadas")}
    toast(`Receita salva: ${o.receita.titulo}.`,{acao:{rotulo:"Abrir",fn:()=>go("receita",id)}});
  },"Salvar");
};
AC["nova-receita"]=()=>{if(!SAMPLE)return sugerirAj();openDlg("Receita nova no seu nível",`<label class="campo" for="nr-txt">O que você quer cozinhar, ou o que tem em casa?<textarea class="inp" id="nr-txt" placeholder="Ex.: tenho frango, batata e cenoura. Quero algo para o jantar."></textarea></label><p class="nota">O Claude usa só as técnicas das aulas que você concluiu.</p>`,d=>{const t=$("#nr-txt",d).value.trim().slice(0,600);RC.aba="criadas";LS.set("aba","criadas");receitaNova(t)},"Criar receita")};
AC.adaptar=d=>{if(!SAMPLE)return adaptarAj(d);const r=receitaDe(d.id);if(!r)return;openDlg("Adaptar: "+r.titulo,`<label class="campo" for="ad-txt">O que precisa mudar?<textarea class="inp" id="ad-txt" placeholder="Ex.: não tenho creme de leite. Ou: quero fazer na airfryer."></textarea></label><p class="nota">A versão adaptada entra no livro como uma receita nova; a original não muda.</p>`,dl=>{const t=$("#ad-txt",dl).value.trim().slice(0,600);if(!t)return false;adaptar(r,t)},"Adaptar")};

AC.diag=async d=>{
  if(!SAMPLE)return diagAj(d);
  const a=AULAS[d.id],p=S.progresso[d.id];if(!a||!p||DG.busy)return;
  DG.busy=d.id;refresh();
  try{
    const {text}=await SAMPLE(`${REGRAS}\n\nO Flavio fez a aula "${a.titulo}" e avaliou o resultado como "${p.nota==="errado"?"deu errado":"mais ou menos"}".\nO que ele anotou: ${p.anotacao||"(não anotou nada)"}\n\nReceita da aula:\n${ctxReceita(a.receita)}\n\nErros comuns desta aula:\n${a.erros.map(x=>`- ${x.problema}: ${x.conserto}`).join("\n")}\n\nDiga, em no máximo 5 frases, a causa mais provável e o que ele deve mudar na próxima tentativa. Se a anotação não der para saber, diga o que observar da próxima vez.`,
      {cache:false,onText:({text})=>{const el=$("#au-diag");if(el)el.textContent=text}});
    DG.busy=null;const p2=S.progresso[d.id]||p;put("progresso",d.id,{...p2,diagnostico:text.slice(0,2000)});
  }catch(e){DG.busy=null;refresh();const m=msgErro(e);if(m)toast(m)}
};

const DV={busy:false};
AC.duvida=d=>{
  if(!SAMPLE)return duvidaAj(d);
  const id=d.id||(CZ&&CZ.id),r=id&&receitaDe(id);if(!r)return;
  const passo=cur==="cozinhar"&&CZ&&CZ.passo>0?CZ.passo:null;
  const conv=()=>(S.conversas[id]&&S.conversas[id].msgs)||[];
  openDlg("Dúvida: "+r.titulo,`<div class="chat" id="dv-chat"></div>
    <div class="frow"><textarea class="inp" id="dv-txt" rows="2" style="min-height:52px" aria-label="Sua dúvida" placeholder="Ex.: o alho escureceu, continuo?"></textarea><button class="btn acao" id="dv-env" type="button">Perguntar</button></div>
    <p class="nota" id="dv-st"></p>`,null);
  const chat=$("#dv-chat"),st=$("#dv-st");
  const pinta=()=>{chat.innerHTML=conv().slice(-8).map(m=>`<div class="bolha ${m.r==="u"?"u":"c"}">${esc(m.t)}</div>`).join("")||`<p class="nota">Pergunte o que quiser sobre ${passo?"este passo":"esta receita"}.</p>`;chat.scrollTop=chat.scrollHeight};
  pinta();
  $("#dv-env").onclick=async()=>{
    const inp=$("#dv-txt"),t=inp.value.trim().slice(0,800);if(!t||DV.busy)return;
    DV.busy=true;st.textContent="";inp.value="";
    const hist=conv().slice(-10);
    chat.insertAdjacentHTML("beforeend",`<div class="bolha u">${esc(t)}</div><div class="bolha c" id="dv-resp">Pensando…</div>`);chat.scrollTop=chat.scrollHeight;
    const turnos=[{role:"user",content:`${REGRAS}\n\nReceita em andamento:\n${ctxReceita(r)}${passo?`\n\nEle está agora no passo ${passo}: ${r.passos[passo-1].txt}`:""}\n\nResponda às dúvidas dele em no máximo 6 frases curtas. Ele pode estar com a panela no fogo: comece pelo que fazer agora.`},
      ...hist.map(m=>({role:m.r==="u"?"user":"assistant",content:m.t})),{role:"user",content:t}];
    try{
      const {text}=await SAMPLE(turnos,{cache:false,onText:({text})=>{const el=$("#dv-resp");if(el){el.textContent=text;chat.scrollTop=chat.scrollHeight}}});
      await put("conversas",id,{msgs:[...hist,{r:"u",t},{r:"c",t:text.slice(0,3000)}].slice(-20),atualizada:hoje()});
      if($("#dv-chat"))pinta();
    }catch(e){const el=$("#dv-resp");if(el)el.remove();inp.value=t;st.textContent=msgErro(e)}
    finally{DV.busy=false}
  };
};

// ---------- Ajudante na tela (quando o Claude não está disponível) ----------
let BASE_AJ=null;
const baseAj=()=>BASE_AJ||(BASE_AJ=montarBase(TECNICAS,AULAS,LIVRO));
const AJ={adaptar:[],diag:null};
AC["dlg-go"]=d=>{$("#dlg").close();go(d.v,d.id)};
const linkFonte=f=>f&&f.id&&AULAS[f.id]?`<button type="button" class="linkbtn fonte" data-ac="dlg-go" data-v="aula" data-id="${esc(f.id)}">Da aula: ${esc(f.titulo)}</button>`:f&&f.titulo?`<span class="fonte">${esc(f.titulo)}</span>`:"";
function bolhaAj(m){
  return `<div class="bolha c">${esc(m.t)}${linkFonte(m.f)}${m.x&&m.x.length?`<div class="sintomas tambem"><span class="fonte">Também pode ajudar:</span>${m.x.map(e=>e.p===e.r?`<p class="so">${esc(e.r)}</p>`:`<details><summary>${esc(e.p)}</summary><p>${esc(e.r)}</p></details>`).join("")}</div>`:""}</div>`;
}
function duvidaAj(d){
  const id=d.id||(CZ&&CZ.id),r=id&&receitaDe(id);if(!r)return;
  const passo=cur==="cozinhar"&&CZ&&CZ.id===id&&CZ.passo>0?r.passos[CZ.passo-1]:null;
  const conv=()=>(S.conversas[id]&&S.conversas[id].msgs)||[];
  openDlg("Dúvida: "+r.titulo,`<div class="chat" id="dv-chat"></div>
    <div class="frow"><textarea class="inp" id="dv-txt" rows="2" style="min-height:52px" aria-label="Sua dúvida" placeholder="Ex.: o alho escureceu, continuo?"></textarea><button class="btn acao" id="dv-env" type="button">Perguntar</button></div>
    <p class="nota">O Ajudante responde com o que está nas aulas do curso.</p>`,null);
  const chat=$("#dv-chat");
  const pinta=()=>{chat.innerHTML=conv().slice(-8).map(m=>m.r==="u"?`<div class="bolha u">${esc(m.t)}</div>`:bolhaAj(m)).join("")||`<p class="nota">Pergunte o que quiser sobre ${passo?"este passo":"esta receita"}.</p>`;chat.scrollTop=chat.scrollHeight};
  pinta();
  $("#dv-env").onclick=()=>{
    const inp=$("#dv-txt"),t=inp.value.trim().slice(0,800);if(!t)return;inp.value="";
    const res=buscar(t,baseAj(),{aulaId:AULAS[id]?id:(r.base&&AULAS[r.base]?r.base:null),passo});
    const c=res.achou
      ?{r:"c",t:res.principal.resposta,f:res.principal.fonte,x:res.extras.map(e=>({p:e.texto,r:e.resposta}))}
      :{r:"c",t:`Não achei uma resposta para isso no curso.${passo&&passo.pronto?` Neste passo, o ponto certo é: ${passo.pronto}.`:""} Tente com outras palavras, ou veja "Se der errado" na aula.`,f:AULAS[id]?{id,titulo:AULAS[id].titulo}:null};
    put("conversas",id,{msgs:[...conv(),{r:"u",t},c].slice(-20),atualizada:hoje()});
    if($("#dv-chat"))pinta();
  };
}
function adaptarAj(d){
  const r=receitaDe(d.id);if(!r)return;
  const o=opcoesAdaptar(r);
  AJ.adaptar=[...o.trocas.map(t=>({tipo:"troca",...t})),...o.equipamentos.map(e=>({tipo:"equipamento",equipamento:e}))];
  const item=(esc_,i)=>`<button type="button" class="linha" data-ac="ad-esc" data-i="${i}"><span class="cresce"><span class="t">${esc_.t}</span><br><span class="m">${esc_.m}</span></span></button>`;
  const trocas=AJ.adaptar.map((x,i)=>x.tipo==="troca"?item({t:`Não tenho ${esc(r.ingredientes[x.indice].item)}`,m:`Use ${esc(x.troca.por)}: ${esc(x.troca.obs)}`},i):"").join("");
  const equip=AJ.adaptar.map((x,i)=>x.tipo==="equipamento"?item({t:esc(x.equipamento.rotulo),m:esc(x.equipamento.nao)},i):"").join("");
  openDlg("Adaptar: "+r.titulo,`${trocas?`<section class="ajuda-sec"><h3>Não tenho…</h3><div class="lista">${trocas}</div></section>`:""}
    ${equip?`<section class="ajuda-sec"><h3>Quero fazer…</h3><div class="lista">${equip}</div></section>`:""}
    <p class="nota">A versão adaptada entra no livro como uma receita nova; a original não muda.</p>`,null);
  AJ.receita=r;
}
AC["ad-esc"]=d=>{
  const esc_=AJ.adaptar[+d.i],r=AJ.receita;if(!esc_||!r)return;
  const n=adaptarReceita(r,esc_),v=validarReceita(n,new Set(Object.keys(TECNICAS)));
  if(!v){toast("Essa troca não deu certo nesta receita.");return}
  const id="g-"+uid();
  put("receitas",id,{...v,id,base:n.base,feito:n.feito,criada:new Date().toISOString(),origem:"adaptada de "+r.titulo});
  $("#dlg").close();RC.aba="criadas";LS.set("aba","criadas");
  toast(`Receita nova: ${v.titulo}.`,{acao:{rotulo:"Abrir",fn:()=>go("receita",id)}});
};
function sugerirAj(){
  const comuns=ingredientesComuns([...Object.values(AULAS).map(a=>a.receita),...LIVRO]);
  openDlg("O que dá pra fazer com o que tenho",`<p class="nota">Toque no que você tem em casa. Sal, óleo, alho e cebola já contam.</p>
    <div class="escolhas" id="sg-chips">${comuns.map(c=>`<button type="button" class="escolha" data-ac="sg-chip" aria-pressed="false">${esc(c)}</button>`).join("")}</div>
    <label class="campo" for="sg-txt">Outra coisa? Separe por vírgula.<input class="inp" id="sg-txt" placeholder="Ex.: atum, milho"></label>
    <div id="sg-res" aria-live="polite"></div>`,()=>{mostrarSugestoes();return false},"Ver receitas");
}
AC["sg-chip"]=(d,b)=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");
function mostrarSugestoes(){
  const tenho=[...document.querySelectorAll('#sg-chips [aria-pressed="true"]')].map(b=>b.textContent).concat(separarIngredientes($("#sg-txt").value));
  const el=$("#sg-res");
  if(!tenho.length){el.innerHTML=`<p class="nota">Escolha pelo menos um ingrediente.</p>`;return}
  const rs=[...Object.values(AULAS).map(a=>a.receita),...LIVRO];
  const {agora,depois}=sugerir(tenho,rs,tecnicasSabidas());
  const linha=s=>`<button type="button" class="linha" data-ac="dlg-go" data-v="${AULAS[s.id]?"aula":"receita"}" data-id="${esc(s.id)}"><span class="cresce"><span class="t">${esc(s.titulo)}</span><br><span class="m">${s.faltam.length?"Falta: "+esc(listaE(s.faltam)):"Você tem tudo"}${s.aulas?` · Aprenda antes: ${esc(listaE(s.aulas.slice(0,2).map(a=>AULAS[a].titulo)))}`:""}</span></span></button>`;
  el.innerHTML=!agora.length&&!depois.length?`<p class="vazio">Nenhuma receita do curso usa a maior parte disso. Tente juntar mais um ingrediente.</p>`
    :`${agora.length?`<section class="ajuda-sec"><h3>Dá para fazer agora</h3><div class="lista">${agora.slice(0,8).map(linha).join("")}</div></section>`:""}
     ${depois.length?`<section class="ajuda-sec"><h3>Precisa aprender antes</h3><div class="lista">${depois.slice(0,5).map(linha).join("")}</div></section>`:""}`;
  el.scrollIntoView({block:"nearest"});
}
function diagAj(d){
  const a=AULAS[d.id],p=S.progresso[d.id];if(!a||!p)return;
  const prov=diagnosticar(p.anotacao||"",a.erros),ordem=[...prov,...a.erros.map((_,i)=>i).filter(i=>!prov.includes(i))];
  AJ.diag=d.id;
  openDlg("O que deu errado?",`<p class="nota">Toque no que mais parece com o que aconteceu.</p>
    <div class="lista">${ordem.map(i=>`<button type="button" class="linha" data-ac="dg-esc" data-i="${i}"><span class="cresce"><span class="t">${esc(a.erros[i].problema)}</span></span></button>`).join("")}
    <button type="button" class="linha" data-ac="dg-esc" data-i="-1"><span class="cresce"><span class="t">Outra coisa</span></span></button></div>`,null);
}
AC["dg-esc"]=d=>{
  const a=AULAS[AJ.diag],p=S.progresso[AJ.diag];if(!a||!p)return;
  const i=+d.i,txt=i>=0?`${a.erros[i].problema} ${a.erros[i].conserto}`:`Da próxima vez, observe:\n${a.observar.map(o=>"• "+o).join("\n")}`;
  put("progresso",AJ.diag,{...p,diagnostico:txt.slice(0,2000)});$("#dlg").close();
};

// ---------- cópia do progresso ----------
AC.exportar=()=>{
  const txt=JSON.stringify({app:"cozinha-do-flavio",versao:1,exportado:new Date().toISOString(),dados:Object.fromEntries(COLS.map(c=>[c,S[c]]))});
  // Dentro do claude.ai o download não funciona: lá a cópia é só o texto.
  const baixa=!window.claude;
  if(baixa)try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=`cozinha-do-flavio-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch{}
  openDlg("Cópia do progresso",`<p class="prosa">${baixa?"O arquivo foi para os downloads. Se ele não aparecer, copie o texto abaixo":"Copie o texto abaixo"} e guarde num lugar seguro, como um e-mail para você mesmo. No app instalado, use \"Carregar cópia\" e cole o texto.</p>
    <textarea class="inp" id="ex-txt" rows="4" readonly aria-label="Texto da cópia">${esc(txt)}</textarea>
    <div class="acoes"><button class="btn soft" type="button" id="ex-copiar">Copiar o texto</button><span class="nota" id="ex-st" aria-live="polite"></span></div>`,null);
  $("#ex-copiar").onclick=async()=>{const t=$("#ex-txt");try{await navigator.clipboard.writeText(t.value);$("#ex-st").textContent="Copiado."}catch{t.select();$("#ex-st").textContent="Selecionei o texto: use Copiar do celular."}};
};
AC.importar=()=>{
  openDlg("Carregar cópia",`<label class="campo" for="im-arq">Escolha o arquivo da cópia<input class="inp" type="file" id="im-arq" accept=".json,application/json"></label>
    <label class="campo" for="im-txt">Ou cole o texto da cópia<textarea class="inp" id="im-txt" rows="3"></textarea></label>
    <p class="nota" id="im-st" aria-live="polite"></p>`,d=>{
      const r=lerCopia($("#im-txt",d).value.trim());
      if(!r.ok){$("#im-st",d).textContent=r.motivo;return false}
      const n=Object.keys(r.dados.progresso).length,m=Object.keys(r.dados.receitas).length;
      setTimeout(()=>openDlg("Substituir o progresso?",`<p class="prosa">A cópia tem ${n} ${n===1?"aula registrada":"aulas registradas"} e ${m} ${m===1?"receita criada":"receitas criadas"}${r.exportado?`, salva em ${dataBR(r.exportado.slice(0,10))}`:""}. O que está neste aparelho agora será trocado por ela.</p>`,()=>{
        for(const c of COLS){
          for(const id of Object.keys(S[c]))if(!(id in r.dados[c]))del(c,id);
          for(const [id,v] of Object.entries(r.dados[c]))put(c,id,v);
        }
        toast("Progresso carregado.");
      },"Carregar"),0);
    },"Continuar");
  $("#im-arq").onchange=e=>{const fl=e.target.files&&e.target.files[0];if(!fl)return;const fr=new FileReader();fr.onload=()=>{$("#im-txt").value=String(fr.result||"");$("#im-st").textContent="Arquivo lido. Toque em Continuar."};fr.onerror=()=>{$("#im-st").textContent="Não consegui ler esse arquivo."};fr.readAsText(fl)};
};

// ---------- início ----------
const tema=LS.get("tema",null);if(tema==="dark"||tema==="light")document.documentElement.dataset.theme=tema;
{const[v,a]=rota();mostrar(v,a)}
initStore();
})();
</script>
